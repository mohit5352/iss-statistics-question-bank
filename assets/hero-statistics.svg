<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e2e2e"/>
      <stop offset="45%" stop-color="#383838"/>
      <stop offset="100%" stop-color="#424242"/>
    </linearGradient>
    <linearGradient id="curve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1ECE3" stop-opacity="0"/>
      <stop offset="35%" stop-color="#F1ECE3" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#F1ECE3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F1ECE3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2e2e" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#2e2e2e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2e2e2e" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#F1ECE3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F1ECE3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#F1ECE3" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="640" fill="url(#bg)"/>
  <rect width="1920" height="640" fill="url(#grid)"/>
  <ellipse cx="1380" cy="240" rx="520" ry="320" fill="url(#glow)"/>
  <path d="M 120 520 C 280 520, 360 180, 520 180 C 680 180, 760 520, 920 520" fill="none" stroke="url(#curve)" stroke-width="2.5" filter="url(#soft)"/>
  <path d="M 520 180 C 700 180, 820 420, 1000 420 C 1180 420, 1280 200, 1480 200 C 1620 200, 1720 380, 1860 380" fill="none" stroke="#F1ECE3" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="8 12"/>
  <g fill="#F1ECE3" fill-opacity="0.45">
    <circle cx="340" cy="380" r="4"/><circle cx="410" cy="340" r="3"/><circle cx="480" cy="310" r="5"/>
    <circle cx="560" cy="290" r="3"/><circle cx="620" cy="270" r="4"/><circle cx="700" cy="255" r="3"/>
    <circle cx="780" cy="248" r="5"/><circle cx="860" cy="245" r="3"/><circle cx="940" cy="250" r="4"/>
    <circle cx="1020" cy="262" r="3"/><circle cx="1100" cy="280" r="4"/><circle cx="1180" cy="305" r="3"/>
    <circle cx="1260" cy="335" r="5"/><circle cx="1340" cy="370" r="3"/><circle cx="1420" cy="410" r="4"/>
  </g>
  <g fill="#F1ECE3" fill-opacity="0.08">
    <rect x="160" y="420" width="28" height="120" rx="4"/>
    <rect x="200" y="380" width="28" height="160" rx="4"/>
    <rect x="240" y="400" width="28" height="140" rx="4"/>
    <rect x="280" y="350" width="28" height="190" rx="4"/>
  </g>
  <g fill="#F1ECE3" fill-opacity="0.14" font-family="Georgia, serif" font-size="28">
    <text x="1280" y="120">&#956;</text>
    <text x="1340" y="160" font-size="22">&#963;&#178;</text>
    <text x="1480" y="100" font-size="22">&#8747; f(x) dx</text>
    <text x="200" y="140" font-size="24">&#931;</text>
    <text x="1680" y="480" font-size="20">P(A|B)</text>
  </g>
  <rect width="1920" height="640" fill="url(#vignette)"/>
</svg>
