    <script>
        // Admin role: only admin sees Wrong Answer? (sessionStorage.iss_admin)
        function isAdmin() { return sessionStorage.getItem('iss_admin') === '1'; }
        function getAdminName() { return sessionStorage.getItem('iss_admin_name') || 'Admin'; }
        function updateAuthLink() {
            var wrap = document.getElementById('auth-wrap');
            if (!wrap) return;
            var name = getAdminName();
            if (isAdmin()) {
                wrap.innerHTML = '<span class="auth-pill auth-pill-logged">' +
                    '<span class="auth-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>' +
                    '<span class="auth-text">Admin: <strong>' + (name || 'Admin') + '</strong></span>' +
                    '<button type="button" class="auth-logout-btn" aria-label="Logout"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></button>' +
                    '</span>';
                wrap.querySelector('.auth-logout-btn').addEventListener('click', function() {
                    sessionStorage.removeItem('iss_admin');
                    sessionStorage.removeItem('iss_admin_name');
                    window.location.reload();
                });
            } else {
                wrap.innerHTML = '<span class="auth-login-wrap">' +
                    '<a href="login.html" class="auth-pill auth-pill-login">' +
                    '<span class="auth-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></span>' +
                    '<span class="auth-text">Admin Login</span>' +
                    '</a>' +
                    ' <span class="auth-hint">(if you want to update answers)</span>' +
                    '</span>';
            }
        }
        updateAuthLink();

        // Track current selection
        var currentPaper = 'paper1'; // 'paper1' | 'paper2'
        var currentYear = '2025';
        var currentSection = 'prob'; // Paper 1: 'prob' | 'num' | 'comp'; Paper 2: 'linear' | 'inference' | 'official'
        var appMode = 'questions'; // 'questions' | 'notes'

        function setAppMode(mode) {
            appMode = mode;
            document.getElementById('mode-q').classList.toggle('active', mode === 'questions');
            document.getElementById('mode-n').classList.toggle('active', mode === 'notes');
            
            // Hide/Show year selector and set indicator based on mode
            var yearMeta = document.querySelector('.meta-year');
            var setIndicator = document.querySelector('.set-indicator-wrap');
            var lastSep = document.querySelector('.meta-sep-line:last-of-type');
            
            if (yearMeta) yearMeta.style.display = (mode === 'notes') ? 'none' : 'flex';
            if (setIndicator) setIndicator.style.display = (mode === 'notes') ? 'none' : 'flex';
            if (lastSep) lastSep.style.display = (mode === 'notes') ? 'none' : 'block';

            updateControlsUI();
            if (mode === 'questions') {
                loadContent(); // Loads the HTML files
            } else {
                renderRevisionNotes(); // Renders from notes.js
            }
        }

        function renderRevisionNotes() {
            const viewer = document.getElementById('year-viewer');
            const data = REVISION_NOTES[currentPaper][currentSection];

            if (!data || !data.sections || data.sections.length === 0) {
                viewer.innerHTML = '<div class="notes-container"><div class="q-notes-empty">Notes for this section coming soon...</div></div>';
                return;
            }

            let html = `<div class="notes-container">
                <div class="notes-header">
                    <h1>${data.title}</h1>
                </div>
                
                <div class="notes-toc">
                    <div class="toc-syllabus">
                        <span class="syllabus-badge">SYLLABUS</span>
                    </div>

                    <div class="toc-links">`;

            // Table of contents
            data.sections.forEach(sec => {
                html += `<a href="#${sec.id}" class="toc-link">${sec.label}</a>`;
            });

            html += `</div></div>`;

            // Sections
            // Decorative separator (before / between / after sections)
            var sepHtml = `<div class="note-sep" style="display:flex;align-items:center;gap:12px;margin:32px 0 0 0;">
                    <span style="flex:1;height:1px;border-radius:3px;background:linear-gradient(90deg,transparent, rgba(124,58,237,0.85));opacity:0.65;"></span>
                    <svg width="28" height="10" viewBox="0 0 28 10" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="flex:0 0 auto;">
                      <defs>
                        <linearGradient id="g1" x1="0" x2="1">
                          <stop offset="0" stop-color="#a78bfa" stop-opacity="0.95"/>
                          <stop offset="1" stop-color="#7c3aed" stop-opacity="0.95"/>
                        </linearGradient>
                      </defs>
                      <g transform="translate(14,5) rotate(0)">
                        <rect x="-6" y="-2" width="12" height="4" rx="1.5" fill="url(#g1)" transform="rotate(25)"/>
                      </g>
                    </svg>
                    <span style="flex:1;height:1px;border-radius:3px;background:linear-gradient(90deg, rgba(124,58,237,0.85),transparent);opacity:0.65;"></span>
                </div>`;

            // Top separator
            html += sepHtml;
            data.sections.forEach(sec => {
                html += `<section id="${sec.id}" class="note-section">
                    <h2 class="section-title">${sec.label}</h2>
                    <div class="note-section-content">${renderNoteHtml(sec.content)}</div>
                </section>`;
                // Separator after each section
                html += sepHtml;
            });

            // Final Tip Callout
            if (data.tips) {
                html += `<div class="note-callout tip">
                    <div class="callout-icon">💡</div>
                    <div class="callout-content"><strong>Revision Tip:</strong> ${renderNoteHtml(data.tips)}</div>
                </div>`;
            }

            html += `</div>`;
            viewer.innerHTML = html;

            // Trigger MathJax
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([viewer]);
            }
        }

        // Paper sets per year
        var PAPER_SETS = {
            paper1: { '2025': 'A', '2024': 'B', '2023': 'A', '2022': 'A', '2021': 'D', '2020': 'B', '2019': 'C', '2018': 'A', '2017': 'A' },
            paper2: { '2025': 'A', '2024': 'A', '2023': 'A', '2022': 'A', '2021': 'A', '2020': 'D', '2019': 'D', '2018': 'A', '2017': 'A' }
        };

        function updateSetDisplay() {
            var setLetterEl = document.getElementById('set-letter');
            if (!setLetterEl) return;
            var sets = PAPER_SETS[currentPaper];
            var letter = sets && sets[currentYear] ? sets[currentYear] : '';
            setLetterEl.textContent = letter;
        }
        
        function buildFilename() {
            var prefix;
            var basePath;
            
            if (currentPaper === 'paper1') {
                basePath = 'extracted_htmls/stats_paper_1/';
                if (currentSection === 'prob') {
                    prefix = basePath + 'Probability_&_Statistics/Probability_and_Statistics_questions_';
                } else if (currentSection === 'num') {
                    prefix = basePath + 'Numerical_Analysis/Numerical_Analysis_questions_';
                } else if (currentSection === 'comp') {
                    prefix = basePath + 'Computer/Computer_questions_';
                } else {
                    // Fallback to Probability & Statistics
                    prefix = basePath + 'Probability_&_Statistics/Probability_and_Statistics_questions_';
                }
            } else if (currentPaper === 'paper2') {
                basePath = 'extracted_htmls/stats_paper_2/';
                if (currentSection === 'linear') {
                    prefix = basePath + 'Linear_Models/Linear_Models_questions_';
                } else if (currentSection === 'inference') {
                    prefix = basePath + 'Statistical_Inference_and_Hypothesis_Testing/Statistical_Inference_and_Hypothesis_Testing_questions_';
                } else if (currentSection === 'official') {
                    prefix = basePath + 'Official_Statistics/Official_Statistics_questions_';
                } else {
                    // Fallback to Linear Models
                    prefix = basePath + 'Linear_Models/Linear_Models_questions_';
                }
            }
            
            return prefix + currentYear + '.html';
        }

        // ─── Pre-MathJax capture ──────────────────────────────────────────────
        // This MUST run before MathJax touches the DOM.
        // At that point \( ... \) / \[ ... \] are still raw text nodes, so
        // textContent gives us proper LaTeX source rather than garbled SVG text.
        function formatTableForCopy(tableEl) {
            if (!tableEl || !tableEl.querySelectorAll) return '';
            var rows = [];
            tableEl.querySelectorAll('tr').forEach(function(tr) {
                var cells = [];
                tr.querySelectorAll('td, th').forEach(function(cell) {
                    cells.push(cell.textContent.trim());
                });
                if (cells.length) rows.push(cells.join('\t'));
            });
            return rows.join('\n');
        }
        function extractTextWithTables(el) {
            var parts = [];
            function walk(node) {
                if (!node) return;
                if (node.nodeType === 3) {
                    parts.push(node.textContent);
                    return;
                }
                if (node.nodeType === 1) {
                    if (node.classList && node.classList.contains('q-table')) {
                        var table = node.querySelector('table');
                        if (table) parts.push(formatTableForCopy(table));
                        return;
                    }
                    if (node.tagName === 'BR') {
                        parts.push('\n');
                        return;
                    }
                    for (var i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
                }
            }
            walk(el);
            return parts.join('').trim();
        }
        function captureCardCopyText(container) {
            var cards = container.querySelectorAll('.question-card');
            cards.forEach(function(card) {
                var qNumberEl = card.querySelector('.q-number');
                var qNumber = qNumberEl ? qNumberEl.textContent.trim() : '';
                var qTopicEl = card.querySelector('.q-topic');
                var qTopic = qTopicEl ? qTopicEl.textContent.trim() : '';
                var qText = '';
                Array.prototype.forEach.call(card.children, function(child) {
                    if (child.classList && child.classList.contains('q-text')) {
                        var t = extractTextWithTables(child);
                        if (t) qText += t + '\n';
                    } else if (child.classList && child.classList.contains('q-table')) {
                        var t = formatTableForCopy(child.querySelector('table'));
                        if (t) qText += t + '\n';
                    }
                });
                qText = qText.trim();
                var qContextEl = card.querySelector('.q-context');
                var qContext = qContextEl ? extractTextWithTables(qContextEl) + '\n\n' : '';
                var options = [];
                card.querySelectorAll('.option-item').forEach(function(item) {
                    var t = item.textContent.trim();
                    if (t) options.push(t);
                });
                var out = '';
                if (qContext) out += qContext;
                if (qNumber)  out += qNumber + ' ';
                if (qTopic)   out += qTopic + '\n';
                if (qText)    out += qText + '\n\n';
                if (options.length) {
                    out += 'Options:\n';
                    options.forEach(function(o) { out += o + '\n'; });
                }
                card._latexCopyText = out.trim();
            });
        }

        // Wrap option content nodes into a dedicated container (.opt-content)
        // so we can apply width and wrapping rules consistently.
        function wrapOptionContent(container) {
            var optionItems = container.querySelectorAll('.option-item');
            optionItems.forEach(function(item) {
                // Skip if already wrapped
                if (item.querySelector('.opt-content')) return;

                var label = item.querySelector('.opt-label');
                var wrapper = document.createElement('div');
                wrapper.className = 'opt-content';

                // Move all nodes except the label into wrapper
                var child = item.firstChild;
                while (child) {
                    var next = child.nextSibling;
                    if (label && child === label) {
                        // keep label in place
                    } else {
                        try { wrapper.appendChild(child); } catch (e) {}
                    }
                    child = next;
                }

                // Append wrapper to the item (after label)
                item.appendChild(wrapper);
            });
        }

        // Copy button functionality - DRY principle
        function addCopyButtons(container) {
            var questionCards = container.querySelectorAll('.question-card');
            questionCards.forEach(function(card) {
                // Skip if button already exists
                if (card.querySelector('.q-copy-btn')) {
                    return;
                }
                
                // Create copy button
                var copyBtn = document.createElement('button');
                copyBtn.className = 'q-copy-btn';
                copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
                copyBtn.setAttribute('aria-label', 'Copy question');
                copyBtn.setAttribute('data-tooltip', 'Copy');
                
                copyBtn.addEventListener('click', function() {
                    copyQuestionText(card, copyBtn);
                });
                
                // Create actions row: [Wrong Answer?] ... [Show Answer] [Copy]
                card.style.position = 'relative';
                var row = document.createElement('div');
                row.className = 'q-actions-row';
                var left = document.createElement('div');
                left.className = 'q-actions-left';
                var right = document.createElement('div');
                right.className = 'q-actions-right';
                row.appendChild(left);
                row.appendChild(right);
                right.appendChild(copyBtn);
                card.appendChild(row);
            });
        }

        function copyQuestionText(card, button) {
            try {
                // Prefer the pre-MathJax captured text which preserves LaTeX source
                // (\( ... \) / \[ ... \] notation intact — readable by AI tools).
                // Falls back to live DOM extraction if capture was not run.
                var formattedText = card._latexCopyText || '';

                if (!formattedText) {
                    // ── Fallback: extract from post-MathJax DOM (no LaTeX, plain text) ──
                    var qNumberEl = card.querySelector('.q-number');
                    var qNumber = qNumberEl ? qNumberEl.textContent.trim() : '';
                    var qTopicEl = card.querySelector('.q-topic');
                    var qTopic = qTopicEl ? qTopicEl.textContent.trim() : '';
                    var qText = '';
                    Array.prototype.forEach.call(card.children, function(child) {
                        if (child.classList && child.classList.contains('q-text')) {
                            var text = extractTextWithTables(child);
                            if (text) qText += text + '\n';
                        } else if (child.classList && child.classList.contains('q-table')) {
                            var t = formatTableForCopy(child.querySelector('table'));
                            if (t) qText += t + '\n';
                        }
                    });
                    qText = qText.trim();
                    var qContextEl = card.querySelector('.q-context');
                    var qContext = qContextEl ? extractTextWithTables(qContextEl) + '\n\n' : '';
                    var options = [];
                    card.querySelectorAll('.option-item').forEach(function(item) {
                        var optText = item.textContent.trim();
                        if (optText) options.push(optText);
                    });
                    if (qContext) formattedText += qContext;
                    if (qNumber)  formattedText += qNumber + ' ';
                    if (qTopic)   formattedText += qTopic + '\n';
                    if (qText)    formattedText += qText + '\n\n';
                    if (options.length) {
                        formattedText += 'Options:\n';
                        options.forEach(function(opt) { formattedText += opt + '\n'; });
                    }
                    formattedText = formattedText.trim();
                }

                // Copy to clipboard
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(formattedText).then(function() {
                        showCopySuccess(button);
                    }).catch(function(err) {
                        console.error('Failed to copy:', err);
                        fallbackCopy(formattedText, button);
                    });
                } else {
                    fallbackCopy(formattedText, button);
                }
            } catch (error) {
                console.error('Error copying question:', error);
            }
        }

        function showCopySuccess(button) {
            var originalHTML = button.innerHTML;
            button.classList.add('copied');
            // Same circular checkmark icon as show answer button, but green
            button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#10b981" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>';
            button.setAttribute('data-tooltip', 'Copied!');
            setTimeout(function() {
                button.classList.remove('copied');
                button.innerHTML = originalHTML;
                button.setAttribute('data-tooltip', 'Copy');
            }, 2000);
        }

        function fallbackCopy(text, button) {
            // Fallback for older browsers
            var textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showCopySuccess(button);
            } catch (err) {
                console.error('Fallback copy failed:', err);
            }
            document.body.removeChild(textArea);
        }


        function updateControlsUI() {
            var paperValueEl = document.getElementById('paper-value');
            var paperTitleEl = document.getElementById('paper-title');
            var sectionValueEl = document.getElementById('section-value');
            var sectionSelectEl = document.getElementById('section-select');
            var yearValueEl = document.getElementById('year-value');

            // Update paper display
            if (paperValueEl) {
                paperValueEl.textContent = currentPaper === 'paper1' ? 'Paper I' : 'Paper II';
            }
            if (paperTitleEl) {
                paperTitleEl.textContent = currentPaper === 'paper1' ? 'ISS Statistics Paper I' : 'ISS Statistics Paper II';
            }

            // Update section dropdown based on paper
            if (sectionSelectEl) {
                sectionSelectEl.innerHTML = '';
                if (currentPaper === 'paper1') {
                    // Paper I sections
                    sectionSelectEl.innerHTML = 
                        '<option value="prob">Probability &amp; Statistics</option>' +
                        '<option value="num">Numerical Analysis</option>' +
                        '<option value="comp">Computer Section</option>';
                } else {
                    // Paper II sections
                    sectionSelectEl.innerHTML = 
                        '<option value="linear">Linear Models</option>' +
                        '<option value="inference">Statistical Inference and Hypothesis Testing</option>' +
                        '<option value="official">Official Statistics</option>';
                }
                // Set the selected option
                sectionSelectEl.value = currentSection;
            }

            // Update section display text
            if (sectionValueEl) {
                var sectionText = '';
                if (currentPaper === 'paper1') {
                    if (currentSection === 'prob') {
                        sectionText = 'Probability & Statistics';
                    } else if (currentSection === 'num') {
                        sectionText = 'Numerical Analysis';
                    } else if (currentSection === 'comp') {
                        sectionText = 'Computer Section';
                    }
                } else {
                    if (currentSection === 'linear') {
                        sectionText = 'Linear Models';
                    } else if (currentSection === 'inference') {
                        sectionText = 'Statistical Inference and Hypothesis Testing';
                    } else if (currentSection === 'official') {
                        sectionText = 'Official Statistics';
                    }
                }
                sectionValueEl.textContent = sectionText;
            }

            if (yearValueEl) {
                yearValueEl.textContent = currentYear;
            }

            updateSetDisplay();
        }

        function setPaper(paperKey) {
            currentPaper = paperKey;
            // Reset section to first section of the selected paper
            if (currentPaper === 'paper1') {
                currentSection = 'prob';
            } else {
                currentSection = 'linear';
            }
            updateControlsUI();
            if (appMode === 'questions') {
                loadContent();
            } else {
                renderRevisionNotes();
            }
        }

        // Load content using fetch (works on both desktop and mobile)
        function loadContent() {
            if (appMode === 'notes') return;
            var viewer = document.getElementById('year-viewer');
            var filename = buildFilename();
            
            // Show loading state
            viewer.innerHTML = [
                '<div class="qb-loader">',
                '  <div class="qb-loader-ring-wrap">',
                '    <div class="qb-loader-ring-bg"></div>',
                '    <div class="qb-loader-ring-mid"></div>',
                '    <div class="qb-loader-ring"></div>',
                '    <div class="qb-loader-symbol">&#x3A3;</div>',
                '  </div>',
                '  <div class="qb-loader-dots">',
                '    <div class="qb-loader-dot"></div>',
                '    <div class="qb-loader-dot"></div>',
                '    <div class="qb-loader-dot"></div>',
                '  </div>',
                '  <div class="qb-loader-label">Loading questions</div>',
                '</div>'
            ].join('');
            
            // Function to process loaded HTML
            function processHTML(html) {
                // Extract body content from the HTML
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');
                var bodyContent = doc.body.innerHTML;
                
                // Inject content into viewer
                viewer.innerHTML = bodyContent;

                // Normalize option markup first, then capture LaTeX source
                wrapOptionContent(viewer);
                // Capture LaTeX source text BEFORE MathJax replaces text nodes
                captureCardCopyText(viewer);
                
                // Initialize MathJax FIRST, then add buttons AFTER MathJax is done
                function initMathJaxInViewer() {
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        var mathJaxReady = Promise.resolve();
                        if (window.MathJax.startup && window.MathJax.startup.promise) {
                            mathJaxReady = window.MathJax.startup.promise;
                        }
                        
                        mathJaxReady.then(function() {
                            if (window.MathJax.typesetClear) {
                                try {
                                    window.MathJax.typesetClear([viewer]);
                                } catch (e) {
                                    var mathElements = viewer.querySelectorAll('.MathJax, [id^="MathJax"]');
                                    mathElements.forEach(function(el) {
                                        try { el.remove(); } catch (e2) {}
                                    });
                                }
                            } else {
                                var mathElements = viewer.querySelectorAll('.MathJax, [id^="MathJax"]');
                                mathElements.forEach(function(el) {
                                    try { el.remove(); } catch (e) {}
                                });
                            }
                            
                            return window.MathJax.typesetPromise([viewer]);
                        }).then(function() {
                            addCopyButtons(viewer);
                            addShowAnswerButtons(viewer);
                        }).catch(function(err) {
                            console.error('MathJax error:', err);
                            addCopyButtons(viewer);
                            addShowAnswerButtons(viewer);
                        });
                    } else {
                        setTimeout(initMathJaxInViewer, 100);
                    }
                }
                
                setTimeout(initMathJaxInViewer, 200);
            }
            
            // Function to show error
            function showError(error) {
                console.error('Error loading file:', error);
                var isFileProtocol = window.location.protocol === 'file:';
                var errorMessage = isFileProtocol 
                    ? '<div style="text-align:center; padding:40px; color:#d32f2f; max-width:600px; margin:0 auto;">' +
                      '<p style="font-size:1.2em; font-weight:bold; margin-bottom:15px;">⚠️ Cannot Load Questions</p>' +
                      '<p style="font-size:0.95em; margin-bottom:15px; color:#333;">' +
                      'To load local files, use a local web server instead of opening directly.</p>' +
                      '<p style="font-size:0.9em; margin-top:20px; padding:15px; background:#e3f2fd; border-radius:8px; color:#1976d2;">' +
                      '<strong>✅ Solution: Use a Local Web Server</strong><br><br>' +
                      '1. Open terminal in this folder<br>' +
                      '2. Run: <code>python3 -m http.server 8000</code><br>' +
                      '3. Go to: <code>http://localhost:8000/main.html</code><br><br>' +
                      'Or double-click <code>start-server.sh</code> for easy setup!' +
                      '</p>' +
                      '<p style="font-size:0.85em; margin-top:15px; color:#666;">' +
                      'File attempted: ' + filename + '</p>' +
                      '</div>'
                    : '<div style="text-align:center; padding:40px; color:#d32f2f;">' +
                      '<p><strong>Error loading questions</strong></p>' +
                      '<p style="font-size:0.9em; margin-top:10px;">File: ' + filename + '</p>' +
                      '<p style="font-size:0.85em; margin-top:10px; color:#666;">' +
                      'Make sure all HTML files are in the same folder.</p>' +
                      '</div>';
                viewer.innerHTML = errorMessage;
            }
            
            // Try fetch first, fallback to XHR
            if (typeof fetch !== 'undefined') {
                var cacheBuster = '?t=' + new Date().getTime();
                fetch(filename + cacheBuster, {
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
                })
                    .then(function(response) {
                        if (!response.ok) throw new Error('File not found: ' + filename);
                        return response.text();
                    })
                    .then(processHTML)
                    .catch(function() { tryXHR(); });
            } else {
                tryXHR();
            }
            
            function tryXHR() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', filename, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 0 || xhr.status === 200) {
                            processHTML(xhr.responseText);
                        } else {
                            showError('HTTP ' + xhr.status);
                        }
                    }
                };
                xhr.onerror = function() { showError('Network error'); };
                try { xhr.send(); } catch (e) { showError(e.message); }
            }
        }

        function setSection(sectionKey) {
            currentSection = sectionKey;
            updateControlsUI();
            if (appMode === 'questions') {
                loadContent();
            } else {
                renderRevisionNotes();
            }
        }

        function loadYear(year) {
            // Year buttons reuse the same naming scheme, based on current section
            currentYear = year;
            updateControlsUI();
            loadContent();
        }
        
        // Load initial content
        window.addEventListener('load', function () {
            updateControlsUI();
            loadContent();
        });
        
        // Re-render MathJax on orientation change
        window.addEventListener('orientationchange', function() {
            setTimeout(function() {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    var viewer = document.getElementById('year-viewer');
                    window.MathJax.typesetPromise([viewer]).catch(function(err) {
                        console.log('MathJax error:', err);
                    });
                }
            }, 300);
        });
    </script>

    <!-- Show Answer Functionality -->
    <script>
        // Map section keys to answer file keys
        var sectionToAnswerKey = {
            'prob': 'prob',
            'num': 'num',
            'comp': 'comp',
            'linear': 'linear',
            'inference': 'inference',
            'official': 'official'
        };

        // Add show answer buttons and functionality to a container
        function addShowAnswerButtons(container) {
            if (!container) return;
            
            // Get current answers for this paper/section/year
            var answers = QUESTION_ANSWERS[currentPaper];
            if (!answers) return;
            
            var sectionKey = sectionToAnswerKey[currentSection];
            var sectionAnswers = answers[sectionKey];
            if (!sectionAnswers) return;
            
            var yearAnswers = sectionAnswers[currentYear];
            if (!yearAnswers) return;
            
            // Get all question cards
            var questionCards = container.querySelectorAll('.question-card');
            
            questionCards.forEach(function(card) {
                // Skip if button already exists
                if (card.querySelector('.q-answer-btn')) {
                    return;
                }
                
                // Get question number
                var qNumberEl = card.querySelector('.q-number');
                if (!qNumberEl) return;
                
                var qNumber = qNumberEl.textContent.trim().replace('.', '');
                var correctAnswer = getEffectiveAnswer(currentPaper, sectionKey, currentYear, qNumber) || yearAnswers[qNumber];
                
                // Only add button if we have an answer for this question
                if (!correctAnswer) return;
                
                // Create show answer button (eye icon - shown by default)
                var answerBtn = document.createElement('button');
                answerBtn.className = 'q-answer-btn';
                answerBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
                answerBtn.setAttribute('aria-label', 'Show answer for question ' + qNumber);
                answerBtn.setAttribute('data-tooltip', 'Show Answer');
                
                // Add click handler
                answerBtn.addEventListener('click', function() {
                    var effective = getEffectiveAnswer(currentPaper, sectionKey, currentYear, qNumber);
                    toggleAnswer(card, answerBtn, effective || correctAnswer, qNumber);
                });
                
                // Insert into actions row (before copy button)
                var right = card.querySelector('.q-actions-right');
                if (right) {
                    right.insertBefore(answerBtn, right.firstChild);
                } else {
                    card.appendChild(answerBtn);
                }
            });
        }

        // Get effective answer (QUESTION_ANSWERS + localStorage corrections)
        function getEffectiveAnswer(paper, section, year, qNumber) {
            try {
                var corrections = JSON.parse(localStorage.getItem('iss_answer_corrections') || '{}');
                var p = corrections[paper];
                if (p && p[section] && p[section][year] && p[section][year][qNumber]) {
                    return p[section][year][qNumber];
                }
            } catch (e) {}
            var answers = QUESTION_ANSWERS[paper];
            if (!answers) return null;
            var sectionAnswers = answers[sectionToAnswerKey[section]];
            if (!sectionAnswers) return null;
            var yearAnswers = sectionAnswers[year];
            if (!yearAnswers) return null;
            return yearAnswers[qNumber] || null;
        }

        // Toggle answer visibility
        function toggleAnswer(card, button, correctAnswer, qNumber) {
            var isShowing = button.classList.contains('showing');
            var optLabel = (correctAnswer || '').toLowerCase();
            var options = card.querySelectorAll('.option-item');
            
            if (!isShowing) {
                // Show answer - highlight the correct option
                options.forEach(function(opt) {
                    var label = opt.querySelector('.opt-label');
                    if (label && label.textContent.toLowerCase().includes('(' + optLabel + ')')) {
                        opt.classList.add('correct-answer');
                    }
                });
                button.classList.add('showing');
                button.classList.remove('hidden');
                // Change to "eye-off" icon when showing answer
                button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>';
                button.setAttribute('data-tooltip', 'Hide Answer');
                // Show Wrong Answer? (admin) + Notes section (below it)
                showRevealedContent(card, qNumber);
            } else {
                // Hide answer - remove highlight
                options.forEach(function(opt) {
                    opt.classList.remove('correct-answer');
                });
                button.classList.remove('showing');
                button.classList.add('hidden');
                // Change back to "eye" icon
                button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
                button.setAttribute('data-tooltip', 'Show Answer');
                // Hide wrong answer section
                hideWrongAnswerSection(card);
            }
        }

        // Show Wrong Answer? + Add/Edit Explanation (same row) + explanations section below (full width)
        function showRevealedContent(card, qNumber) {
            var row = card.querySelector('.q-actions-row');
            var left = card.querySelector('.q-actions-left');
            if (!row || !left || left.querySelector('.revealed-triggers-row') || card.querySelector('.notes-wrap')) return;
            var secKey = sectionToAnswerKey[currentSection];
            if (isAdmin()) {
                var triggersRow = document.createElement('div');
                triggersRow.className = 'revealed-triggers-row';
                var currentAnswer = getEffectiveAnswer(currentPaper, secKey, currentYear, qNumber) || '';
                var wrap = document.createElement('span');
                wrap.className = 'wrong-answer-wrap';
                wrap.innerHTML = '<span class="wrong-answer-trigger">Wrong Answer?</span><span class="wrong-answer-picker"><span class="wrong-answer-hint">Choose correct answer</span><span class="wrong-answer-chips"></span></span>';
                var pickerEl = wrap.querySelector('.wrong-answer-picker');
                var chipsEl = wrap.querySelector('.wrong-answer-chips');
                ['a','b','c','d'].forEach(function(opt) {
                    var chip = document.createElement('button');
                    chip.className = 'wrong-answer-chip' + (opt === currentAnswer ? ' selected' : '');
                    chip.textContent = '(' + opt + ')';
                    chip.setAttribute('data-opt', opt);
                    chip.addEventListener('click', function() {
                        saveCorrection(card, qNumber, opt, secKey, chipsEl);
                    });
                    chipsEl.appendChild(chip);
                });
                wrap.querySelector('.wrong-answer-trigger').addEventListener('click', function() {
                    pickerEl.classList.toggle('open');
                    wrap.classList.toggle('picker-open', pickerEl.classList.contains('open'));
                });
                triggersRow.appendChild(wrap);
                var noteText = getEffectiveExplanation(currentPaper, secKey, currentYear, qNumber) || '';
                var addEditSpan = document.createElement('span');
                addEditSpan.className = 'edit-explanation-trigger';
                addEditSpan.textContent = noteText ? 'Edit Explanation' : 'Add Explanation';
                addEditSpan.addEventListener('click', function() {
                    var nw = card.querySelector('.notes-wrap');
                    if (!nw) return;
                    if (nw.querySelector('.note-editor')) {
                        showNotesView(card, qNumber, nw);
                    } else {
                        showNotesEditor(card, qNumber, nw);
                    }
                });
                triggersRow.appendChild(addEditSpan);
                left.appendChild(triggersRow);
            }
            var notesWrap = document.createElement('div');
            notesWrap.className = 'notes-wrap';
            row.insertAdjacentElement('afterend', notesWrap);
            showNotesView(card, qNumber, notesWrap);
        }

        function hideWrongAnswerSection(card) {
            var left = card.querySelector('.q-actions-left');
            if (left) left.innerHTML = '';
            var notesWrap = card.querySelector('.notes-wrap');
            if (notesWrap) notesWrap.remove();
        }

        // Batch corrections to minimize GitHub commits (30s debounce)
        var correctionQueue = [];
        var correctionTimer = null;
        var CORRECTION_DEBOUNCE_MS = 15000;

        function persistToLocalStorage(paper, section, year, q, answer) {
            try {
                var corrections = JSON.parse(localStorage.getItem('iss_answer_corrections') || '{}');
                if (!corrections[paper]) corrections[paper] = {};
                if (!corrections[paper][section]) corrections[paper][section] = {};
                if (!corrections[paper][section][year]) corrections[paper][section][year] = {};
                corrections[paper][section][year][q] = answer;
                localStorage.setItem('iss_answer_corrections', JSON.stringify(corrections));
            } catch (e) {}
        }

        function flushCorrectionQueue() {
            if (correctionTimer) { clearTimeout(correctionTimer); correctionTimer = null; }
            if (correctionQueue.length === 0) return;
            var batch = correctionQueue.slice();
            correctionQueue = [];
            fetch('/api/correct', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ corrections: batch })
            }).then(function(r) { return r.json(); }).then(function(res) {
                if (res.ok) {
                    var n = res.count || batch.length;
                    showCorrectionToast(n === 1 ? 'Updated answers.js' : n + ' corrections saved to answers.js');
                } else {
                    batch.forEach(function(c) { persistToLocalStorage(c.paper, c.section, c.year, c.q, c.answer); });
                    showCorrectionToast('Save failed — stored locally');
                }
            }).catch(function() {
                batch.forEach(function(c) { persistToLocalStorage(c.paper, c.section, c.year, c.q, c.answer); });
                showCorrectionToast('Offline — stored locally');
            });
        }

        function saveCorrection(card, qNumber, answer, secKey, chipsEl) {
            if (QUESTION_ANSWERS[currentPaper] && QUESTION_ANSWERS[currentPaper][secKey] && QUESTION_ANSWERS[currentPaper][secKey][currentYear]) {
                QUESTION_ANSWERS[currentPaper][secKey][currentYear][qNumber] = answer;
            }
            applyCorrection(card, answer, chipsEl);

            var origin = window.location.origin;
            var canUseApi = origin && origin !== 'null' && origin !== 'file://';
            if (canUseApi) {
                var key = currentPaper + '|' + secKey + '|' + currentYear + '|' + qNumber;
                correctionQueue = correctionQueue.filter(function(c) { return c.key !== key; });
                correctionQueue.push({ paper: currentPaper, section: secKey, year: currentYear, q: qNumber, answer: answer, key: key });
                showCorrectionToast('Queued — saving in 15s');
                if (correctionTimer) clearTimeout(correctionTimer);
                correctionTimer = setTimeout(flushCorrectionQueue, CORRECTION_DEBOUNCE_MS);
            } else {
                saveToLocalStorage(card, qNumber, answer, secKey, chipsEl);
            }
        }

        window.addEventListener('beforeunload', function() {
            if (correctionQueue.length > 0 && navigator.sendBeacon) {
                var blob = new Blob([JSON.stringify({ corrections: correctionQueue })], { type: 'application/json' });
                navigator.sendBeacon('/api/correct', blob);
            }
        });

        function saveToLocalStorage(card, qNumber, answer, secKey, chipsEl) {
            try {
                var corrections = JSON.parse(localStorage.getItem('iss_answer_corrections') || '{}');
                if (!corrections[currentPaper]) corrections[currentPaper] = {};
                if (!corrections[currentPaper][secKey]) corrections[currentPaper][secKey] = {};
                if (!corrections[currentPaper][secKey][currentYear]) corrections[currentPaper][secKey][currentYear] = {};
                corrections[currentPaper][secKey][currentYear][qNumber] = answer;
                localStorage.setItem('iss_answer_corrections', JSON.stringify(corrections));
                applyCorrection(card, answer, chipsEl);
                showCorrectionToast('Saved (use server to update answers.js)');
            } catch (e) { showCorrectionToast('Failed'); }
        }

        function applyCorrection(card, answer, chipsEl) {
            chipsEl.querySelectorAll('.wrong-answer-chip').forEach(function(c) {
                c.classList.toggle('selected', c.getAttribute('data-opt') === answer);
            });
            var options = card.querySelectorAll('.option-item');
            options.forEach(function(opt) {
                opt.classList.remove('correct-answer');
                var label = opt.querySelector('.opt-label');
                if (label && label.textContent.toLowerCase().includes('(' + answer + ')')) {
                    opt.classList.add('correct-answer');
                }
            });
        }

        function showCorrectionToast(msg) {
            var toast = document.createElement('div');
            toast.className = 'correction-toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { toast.classList.add('show'); }, 10);
            setTimeout(function() {
                toast.classList.remove('show');
                setTimeout(function() { toast.remove(); }, 300);
            }, 2500);
        }
    </script>

    <!-- Explanations functionality (shown with answer, below Wrong Answer?) -->
    <script>
        var sectionToExplanationsKey = sectionToAnswerKey;

        function getEffectiveExplanation(paper, section, year, qNumber) {
            try {
                var edits = JSON.parse(localStorage.getItem('iss_explanation_edits') || '{}');
                if (Object.keys(edits).length === 0) {
                    var legacy = localStorage.getItem('iss_note_edits');
                    if (legacy) { localStorage.setItem('iss_explanation_edits', legacy); edits = JSON.parse(legacy); }
                }
                var p = edits[paper];
                if (p && p[section] && p[section][year] && p[section][year][qNumber]) {
                    return p[section][year][qNumber];
                }
            } catch (e) {}
            if (typeof QUESTION_EXPLANATIONS === 'undefined') return null;
            var pnotes = QUESTION_EXPLANATIONS[paper];
            if (!pnotes) return null;
            var sec = pnotes[section];
            if (!sec) return null;
            var yearNotes = sec[year];
            if (!yearNotes) return null;
            return yearNotes[qNumber] || null;
        }

        // Explanations section: view mode (message/content) or edit mode (textarea + buttons). Add/Edit Explanation is in triggers row.
        function showNotesView(card, qNumber, notesWrap) {
            var noteText = getEffectiveExplanation(currentPaper, sectionToExplanationsKey[currentSection], currentYear, qNumber) || '';
            notesWrap.innerHTML = '<div class="q-notes-content">' + renderNoteHtml(noteText) + '</div>';
            var trigger = card.querySelector('.revealed-triggers-row .edit-explanation-trigger');
            if (trigger) trigger.textContent = noteText ? 'Edit Explanation' : 'Add Explanation';
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([notesWrap]).catch(function(err) { console.warn('MathJax:', err); });
            }
        }

        function renderNoteHtml(text) {
            if (!text) return '<div class="q-notes-empty">No content available</div>';
            
            // 1. Protect MathJax LaTeX snippets
            var placeholders = [];
            var s = text.replace(/\\\[[\s\S]*?\\\]|\\\(.*?\\\)/g, function(match) {
                var id = '%%LATEX_' + placeholders.length + '%%';
                placeholders.push(match);
                return id;
            });

            // 2. Simple Markdown parsing
            var lines = s.split('\n');
            var resultHtml = '';
            var inUl = false;
            var inOl = false;
            var inTable = false;
            var tableRows = [];

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                
                // Handle Tables
                if (line.startsWith('|') && line.endsWith('|')) {
                    if (inUl) { resultHtml += '</ul>'; inUl = false; }
                    if (inOl) { resultHtml += '</ol>'; inOl = false; }
                    if (line.indexOf('---') === -1) {
                        var cells = line.split('|').slice(1, -1);
                        tableRows.push(cells.map(c => c.trim()));
                    }
                    inTable = true;
                    continue;
                } else if (inTable) {
                    resultHtml += '<div class="q-table"><table>';
                    tableRows.forEach((row, idx) => {
                        resultHtml += '<tr>';
                        row.forEach(cell => {
                            var tag = (idx === 0) ? 'th' : 'td';
                            resultHtml += `<${tag}>${parseInline(cell)}</${tag}>`;
                        });
                        resultHtml += '</tr>';
                    });
                    resultHtml += '</table></div>';
                    tableRows = [];
                    inTable = false;
                }

                // Handle Headers
                if (line.startsWith('###')) {
                    if (inUl) { resultHtml += '</ul>'; inUl = false; }
                    if (inOl) { resultHtml += '</ol>'; inOl = false; }
                    resultHtml += `<h3 class="note-h3">${parseInline(line.replace('###', ''))}</h3>`;
                } else if (line.startsWith('##')) {
                    if (inUl) { resultHtml += '</ul>'; inUl = false; }
                    if (inOl) { resultHtml += '</ol>'; inOl = false; }
                    resultHtml += `<h2 class="note-h2">${parseInline(line.replace('##', ''))}</h2>`;
                } 
                // Handle Unordered Lists
                else if (line.startsWith('- ') || line.startsWith('* ')) {
                    if (inOl) { resultHtml += '</ol>'; inOl = false; }
                    if (!inUl) { resultHtml += '<ul class="note-list">'; inUl = true; }
                    resultHtml += `<li>${parseInline(line.substring(2))}</li>`;
                }
                // Handle Ordered Lists (1. )
                else if (/^\d+\.\s/.test(line)) {
                    if (inUl) { resultHtml += '</ul>'; inUl = false; }
                    if (!inOl) { resultHtml += '<ol class="note-list note-ol">'; inOl = true; }
                    resultHtml += `<li>${parseInline(line.replace(/^\d+\.\s/, ''))}</li>`;
                }
                // Handle Paragraphs
                else if (line.length > 0) {
                    if (inUl) { resultHtml += '</ul>'; inUl = false; }
                    if (inOl) { resultHtml += '</ol>'; inOl = false; }
                    resultHtml += `<p class="note-p">${parseInline(line)}</p>`;
                } else {
                    if (inUl) { resultHtml += '</ul>'; inUl = false; }
                    if (inOl) { resultHtml += '</ol>'; inOl = false; }
                }
            }
            if (inUl) resultHtml += '</ul>';
            if (inOl) resultHtml += '</ol>';

            function parseInline(txt) {
                var t = txt.replace(/&/g, '&amp;')
                           .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                           .replace(/`(.*?)`/g, '<code>$1</code>');
                return t;
            }

            // 3. Restore MathJax LaTeX snippets
            for (var i = 0; i < placeholders.length; i++) {
                resultHtml = resultHtml.replace('%%LATEX_' + i + '%%', placeholders[i]);
            }

            return resultHtml;
        }

        function showNotesEditor(card, qNumber, notesWrap) {
            notesWrap.innerHTML = '';
            var editor = document.createElement('div');
            editor.className = 'note-editor';
            editor.innerHTML = '<textarea class="note-editor-text" placeholder="Write explanation — LaTeX is OK (use \\(\\) or \\[\\])"></textarea>' +
                '<div class="note-editor-actions"><button class="note-cancel-btn">Cancel</button><button class="note-save-btn">Save</button></div>';
            notesWrap.appendChild(editor);
            var ta = editor.querySelector('.note-editor-text');
            ta.value = getEffectiveExplanation(currentPaper, sectionToExplanationsKey[currentSection], currentYear, qNumber) || '';
            editor.querySelector('.note-cancel-btn').addEventListener('click', function() {
                showNotesView(card, qNumber, notesWrap);
            });
            editor.querySelector('.note-save-btn').addEventListener('click', function() {
                var val = ta.value.trim();
                saveNoteEdit(card, qNumber, val);
                showNotesView(card, qNumber, notesWrap);
            });
            ta.focus();
        }

        // Queue & persist flow similar to answers corrections
        var noteEditQueue = [];
        var noteEditTimer = null;
        var NOTE_DEBOUNCE_MS = 15000;

        function persistNoteToLocalStorage(paper, section, year, q, note) {
            try {
                var edits = JSON.parse(localStorage.getItem('iss_explanation_edits') || '{}');
                if (!edits[paper]) edits[paper] = {};
                if (!edits[paper][section]) edits[paper][section] = {};
                if (!edits[paper][section][year]) edits[paper][section][year] = {};
                edits[paper][section][year][q] = note;
                localStorage.setItem('iss_explanation_edits', JSON.stringify(edits));
            } catch (e) {}
        }

        function flushNoteEditQueue() {
            if (noteEditTimer) { clearTimeout(noteEditTimer); noteEditTimer = null; }
            if (noteEditQueue.length === 0) return;
            var batch = noteEditQueue.slice();
            noteEditQueue = [];
            fetch('/api/explanations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ edits: batch })
            }).then(function(r) { return r.json(); }).then(function(res) {
                if (res.ok) {
                    showCorrectionToast(res.count === 1 ? 'Updated explanations.js' : (res.count + ' explanations saved to explanations.js'));
                } else {
                    batch.forEach(function(c) { persistNoteToLocalStorage(c.paper, c.section, c.year, c.q, c.note); });
                    showCorrectionToast('Save failed — stored locally');
                }
            }).catch(function() {
                batch.forEach(function(c) { persistNoteToLocalStorage(c.paper, c.section, c.year, c.q, c.note); });
                showCorrectionToast('Offline — stored locally');
            });
        }

        function saveNoteEdit(card, qNumber, noteText) {
            var secKey = sectionToExplanationsKey[currentSection];
            try {
                if (typeof QUESTION_EXPLANATIONS === 'undefined') window.QUESTION_EXPLANATIONS = {};
                if (!QUESTION_EXPLANATIONS[currentPaper]) QUESTION_EXPLANATIONS[currentPaper] = {};
                if (!QUESTION_EXPLANATIONS[currentPaper][secKey]) QUESTION_EXPLANATIONS[currentPaper][secKey] = {};
                if (!QUESTION_EXPLANATIONS[currentPaper][secKey][currentYear]) QUESTION_EXPLANATIONS[currentPaper][secKey][currentYear] = {};
                QUESTION_EXPLANATIONS[currentPaper][secKey][currentYear][qNumber] = noteText;
            } catch (e) {}
            var notesWrap = card.querySelector('.notes-wrap');
            if (notesWrap) showNotesView(card, qNumber, notesWrap);

            var origin = window.location.origin;
            var canUseApi = origin && origin !== 'null' && origin !== 'file://';
            if (canUseApi) {
                var key = currentPaper + '|' + secKey + '|' + currentYear + '|' + qNumber;
                noteEditQueue = noteEditQueue.filter(function(c) { return c.key !== key; });
                noteEditQueue.push({ paper: currentPaper, section: secKey, year: currentYear, q: qNumber, note: noteText, key: key });
                showCorrectionToast('Queued — saving in 15s');
                if (noteEditTimer) clearTimeout(noteEditTimer);
                noteEditTimer = setTimeout(flushNoteEditQueue, NOTE_DEBOUNCE_MS);
            } else {
                persistNoteToLocalStorage(currentPaper, secKey, currentYear, qNumber, noteText);
                showCorrectionToast('Saved locally (use server to update explanations.js)');
            }
        }

        // Send pending edits on unload if possible
        window.addEventListener('beforeunload', function() {
            if (noteEditQueue.length > 0 && navigator.sendBeacon) {
                var blob = new Blob([JSON.stringify({ edits: noteEditQueue })], { type: 'application/json' });
                navigator.sendBeacon('/api/explanations', blob);
            }
        });

    </script>
</body>
</html>
