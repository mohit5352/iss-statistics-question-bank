<body>

    <noscript>
        <div style="padding:20px;max-width:800px;margin:0 auto;font-family:sans-serif;">
            <h1>UPSC ISS Statistics Paper I & II Question Bank</h1>
            <p><strong>UPSC Indian Statistical Service (ISS)</strong> question bank for <strong>Statistics Paper I</strong> and <strong>Statistics Paper II</strong>.</p>

        </div>
    </noscript>

    <div class="paper-container">
        <!-- Sticky Header -->
        <div class="sticky-header">
            <div class="header-top-row">
                <div class="mode-toggle-wrap">
                    <button class="mode-btn active" id="mode-q" onclick="setAppMode('questions')">Questions</button>
                    <button class="mode-btn" id="mode-n" onclick="setAppMode('notes')">Revision Notes</button>
                </div>
                <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
                    <span class="theme-icon-dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg></span>
                    <span class="theme-icon-light"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg></span>
                </button>
            </div>
            <h1 id="paper-title">ISS Statistics Paper I</h1>
            <div class="set-indicator-wrap">
                <span class="set-indicator-line set-indicator-left"></span>
                <span class="set-indicator-text">Set <span class="set-dot">◆</span> <span id="set-letter">A</span></span>
                <span class="set-indicator-line set-indicator-right"></span>
            </div>
            <div class="meta-controls">
                <div class="meta-item meta-paper">
                    <span class="meta-label">Paper</span>
                    <span class="meta-value" id="paper-value">Paper I</span>
                    <select id="paper-select" onchange="setPaper(this.value)">
                        <option value="paper1">Paper I</option>
                        <option value="paper2">Paper II</option>
                        <option value="paper3">Paper III</option>
                        <option value="paper4">Paper IV</option>
                    </select>
                </div>
                <div class="meta-sep-line"></div>
                <div class="meta-item meta-section">
                    <span class="meta-label">Section</span>
                    <span class="meta-value" id="section-value">Probability &amp; Statistics</span>
                    <select id="section-select" onchange="setSection(this.value)">
                        <option value="prob">Probability &amp; Statistics</option>
                        <option value="num">Numerical Analysis</option>
                        <option value="comp">Computer Section</option>
                    </select>
                </div>
                <div class="meta-sep-line"></div>
                <div class="meta-item meta-year">
                    <span class="meta-label">Year</span>
                    <span class="meta-value" id="year-value">2025</span>
                    <select id="year-select" onchange="loadYear(this.value)">
                        <option value="2025">2025</option>

                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>

        <!-- Content viewer -->

    <script src="notes.js"></script>
    <script src="answers.js"></script>
    <script src="explanations.js"></script>
    <script src="question_edits.js"></script>
    <script>
        // Theme Management
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        
        // Initial theme load (before DOM is fully ready to prevent flash)
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
            }
        })();

        // Admin role: only admin sees Wrong Answer?, Study chat, Ask AI, etc. (sessionStorage.iss_admin)
        function isAdmin() { return sessionStorage.getItem('iss_admin') === '1'; }
        window.isAdmin = isAdmin;
        function getAdminName() { return sessionStorage.getItem('iss_admin_name') || 'Admin'; }
        function updateAuthLink() {
            var wrap = document.getElementById('auth-wrap');
            if (!wrap) return;
            var name = getAdminName();
            if (isAdmin()) {
                wrap.innerHTML = '<span class="auth-pill auth-pill-logged">' +
                    '<span class="auth-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>' +
                    '<span class="auth-text">Admin: <strong>' + (name || 'Admin') + '</strong></span>' +
                    '<button type="button" class="auth-logout-btn" aria-label="Logout"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></button>' +
                    '</span>';
                wrap.querySelector('.auth-logout-btn').addEventListener('click', function() {
                    sessionStorage.removeItem('iss_admin');
                    sessionStorage.removeItem('iss_admin_name');
                    window.location.reload();
                });
            } else {
                wrap.innerHTML = '<span class="auth-login-wrap">' +
                    '<a href="login.html" class="auth-pill auth-pill-login">' +
                    '<span class="auth-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></span>' +
                    '<span class="auth-text">Admin Login</span>' +
                    '</a>' +
                    ' <span class="auth-hint">(admin tools &amp; Study chat)</span>' +
                    '</span>';
            }
        }
        updateAuthLink();

        // Track current selection
        var currentPaper = 'paper1'; // 'paper1' | 'paper2' | 'paper3' | 'paper4'
        var currentYear = '2025';
        // Paper 1: prob | num | comp; Paper 2: linear | inference | official; Paper 3: sampling | econometrics | applied; Paper 4: demography | quality
        var currentSection = 'prob';
        var appMode = 'questions'; // 'questions' | 'notes'

        function setAppMode(mode) {
            appMode = mode;
            document.getElementById('mode-q').classList.toggle('active', mode === 'questions');
            document.getElementById('mode-n').classList.toggle('active', mode === 'notes');
            
            // Hide/Show year selector and set indicator based on mode
            var yearMeta = document.querySelector('.meta-year');
            var setIndicator = document.querySelector('.set-indicator-wrap');
            var lastSep = document.querySelector('.meta-sep-line:last-of-type');
            
            if (yearMeta) yearMeta.style.display = (mode === 'notes') ? 'none' : 'flex';
            if (setIndicator) setIndicator.style.display = (mode === 'notes') ? 'none' : 'flex';
            if (lastSep) lastSep.style.display = (mode === 'notes') ? 'none' : 'block';

            updateControlsUI();
            if (mode === 'questions') {
                loadContent(); // Loads the HTML files
            } else {
                renderRevisionNotes(); // Renders from notes.js
            }
        }

        function buildTocItem(id, label, isSection) {
            var copySvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
            var editSvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M3 17.25V21h4.25L17.81 9.94l-4.25-4.25L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 4.25 4.25 1.83-1.83z"/></svg>';
            var delSvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
            var actions = '<div class="toc-item-actions" onclick="event.stopPropagation()">' +
                '<button class="toc-action-btn toc-copy-btn" title="Copy" data-tooltip="Copy" onclick="copyNoteContent(\'' + id + '\', event)" aria-label="Copy">' + copySvg + '</button>';
            if (isAdmin()) {
                if (isSection) {
                    actions += '<button class="toc-action-btn toc-edit-btn" title="Edit" onclick="showNoteSectionEditor(\'' + id + '\')" aria-label="Edit">' + editSvg + '</button>';
                    actions += '<button class="toc-action-btn toc-delete-btn" title="Delete" onclick="deleteNoteSection(\'' + id + '\')" aria-label="Delete">' + delSvg + '</button>';
                } else {
                    actions += '<button class="toc-action-btn toc-edit-btn" title="Edit tips" onclick="showTipsEditor()" aria-label="Edit tips">' + editSvg + '</button>';
                }
            }
            actions += '</div>';
            return '<div class="toc-item" data-section="' + id + '">' +
                '<a href="#' + id + '" class="toc-link">' + label + '</a>' + actions + '</div>';
        }

        function renderRevisionNotes() {
            const viewer = document.getElementById('year-viewer');
            const paperData = REVISION_NOTES[currentPaper] || {};
            const data = paperData[currentSection] || { title: currentSection, sections: [], tips: "" };

            var sepHtml = `<div class="note-sep" style="display:flex;align-items:center;gap:2px;margin:28px 0;">
                    <span style="flex:1;height:3px;border-radius:6px;background:linear-gradient(90deg,transparent, rgba(124,58,237,0.95));opacity:0.9;box-shadow:0 2px 8px rgba(124,58,237,0.08)"></span>
                    <svg width="48" height="28" viewBox="0 0 48 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="flex:0 0 auto;">
                        <defs>
                            <linearGradient id="sepGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#c4b5fd"/>
                            <stop offset="1" stop-color="#7c3aed"/>
                            </linearGradient>
                        </defs>
                        <text x="10" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="url(#sepGrad)" style="font-family:system-ui, -apple-system, Segoe UI, sans-serif;">μ</text>
                        <text x="24" y="19" text-anchor="middle" font-size="16" font-weight="700" fill="url(#sepGrad)" style="font-family:system-ui, -apple-system, Segoe UI, sans-serif;">Σ</text>
                        <text x="38" y="18" text-anchor="middle" font-size="13" font-weight="600" fill="url(#sepGrad)" style="font-family:system-ui, -apple-system, Segoe UI, sans-serif;">∫</text>
                        <circle cx="16.5" cy="14" r="1.2" fill="url(#sepGrad)" opacity="0.7"/>
                        <circle cx="31.5" cy="14" r="1.2" fill="url(#sepGrad)" opacity="0.7"/>
                    </svg>
                    <span style="flex:1;height:3px;border-radius:6px;background:linear-gradient(90deg, rgba(124,58,237,0.95),transparent);opacity:0.9;box-shadow:0 2px 8px rgba(124,58,237,0.08)"></span>
                </div>`;

            // New Layout Structure: Sidebar + Main Content
            let html = `
                <div class="notes-layout" id="notes-layout">
                    <aside class="notes-sidebar" id="notes-sidebar">
                        <div class="sidebar-header">
                            <span class="topic-badge">KEY TOPICS</span>
                            <button class="sidebar-close-btn" onclick="toggleSidebar()" aria-label="Close Sidebar">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                            </button>
                        </div>
                        <div class="toc-links" id="toc-links">`;

            if (data.sections && data.sections.length > 0) {
                data.sections.forEach(sec => {
                    html += buildTocItem(sec.id, sec.label, true);
                });
                if (data.tips || isAdmin()) {
                    html += buildTocItem('note-tips-container', 'Revision Tips', false);
                }
            } else {
                html += `<p class="q-notes-empty" style="padding: 10px;">No topics yet.</p>`;
            }

            html += `   </div>
                        ${isAdmin() ? `<button class="sidebar-add-btn" onclick="showAddSectionForm()">+ Add Section</button>` : ''}
                    </aside>
                    
                    <button class="sidebar-open-btn" id="sidebar-open-btn" onclick="toggleSidebar()" aria-label="Open Sidebar">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                        <span>Topics</span>
                    </button>

                    <main class="notes-main-content">
                        <div class="notes-container">
                            <div class="notes-header">
                                <h1>${data.title}</h1>
                            </div>
                            ${sepHtml}`;

            if (!data.sections || data.sections.length === 0) {
                html += `
                    <div class="q-notes-empty">
                        <p>No notes available for this section yet.</p>
                        ${isAdmin() ? `<button class="note-add-btn" onclick="showAddSectionForm()">+ Add First Section</button>` : ''}
                    </div>
                `;
            } else {
                // Sections
                var copyIcon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
                var editIcon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 17.25V21h4.25L17.81 9.94l-4.25-4.25L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 4.25 4.25 1.83-1.83z"/></svg>';
                var delIcon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
                data.sections.forEach(sec => {
                    var headerActions = '<div class="note-section-actions"><button class="note-section-action-btn" title="Copy" onclick="copyNoteContent(\'' + sec.id + '\', event)" aria-label="Copy">' + copyIcon + '</button>';
                    if (isAdmin()) {
                        headerActions += '<button class="note-section-action-btn" title="Edit" onclick="showNoteSectionEditor(\'' + sec.id + '\')" aria-label="Edit">' + editIcon + '</button>';
                        headerActions += '<button class="note-section-action-btn note-section-delete-btn" title="Delete" onclick="deleteNoteSection(\'' + sec.id + '\')" aria-label="Delete">' + delIcon + '</button>';
                    }
                    headerActions += '</div>';
                    html += `<section id="${sec.id}" class="note-section">
                        <div class="note-section-header" style="display:flex; justify-content:space-between; align-items:center;">
                            <h2 class="section-title" id="note-label-${sec.id}">${sec.label}</h2>
                            ${headerActions}
                        </div>
                        <div class="note-section-content" id="note-content-${sec.id}">${renderNoteHtml(sec.content)}</div>
                    </section>`;
                    html += sepHtml;
                });

                // Final Tip Callout
                if (data.tips || isAdmin()) {
                    html += `<div class="note-callout tip" id="note-tips-container" style="width:100%; box-sizing:border-box;">
                        <div class="callout-icon">💡</div>
                        <div class="callout-content" style="width:100%;">
                            <div class="note-section-header" style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:8px;">
                                <span class="tip-label">Revision Priorities & Tips</span>
                                <div class="note-section-actions">
                                    <button class="note-section-action-btn" title="Copy" onclick="copyNoteContent('note-tips-container', event)" aria-label="Copy">${copyIcon}</button>
                                    ${isAdmin() ? '<button class="note-section-action-btn" title="Edit" onclick="showTipsEditor()" aria-label="Edit">' + editIcon + '</button>' : ''}
                                </div>
                            </div>
                            <div id="note-tips-content" style="width:100%;">${data.tips ? renderNoteHtml(data.tips) : '<div class="q-notes-empty">No tips available yet</div>'}</div>
                        </div>
                    </div>`;
                }
            }

            html += `</div></main></div>`;
            viewer.innerHTML = html;

            // Initialize sidebar state from localStorage
            if (localStorage.getItem('iss_sidebar_collapsed') === 'true') {
                document.getElementById('notes-layout').classList.add('sidebar-collapsed');
            }

            // Setup TOC highlighting and outside-click-to-close
            if (data.sections && data.sections.length > 0) {
                initNotesSidebar();
            }

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([viewer]);
            }
        }

        function initNotesSidebar() {
            const layout = document.getElementById('notes-layout');
            const sidebar = document.getElementById('notes-sidebar');
            const tocLinks = document.getElementById('toc-links');

        // ─── Pre-MathJax capture ──────────────────────────────────────────────
        // This MUST run before MathJax touches the DOM.
        // At that point \( ... \) / \[ ... \] are still raw text nodes, so
        // textContent gives us proper LaTeX source rather than garbled SVG text.
        /** GitHub-flavored markdown table (readable in chat, copy, and editors). */
        function formatTableAsMarkdown(tableEl) {
            if (!tableEl || !tableEl.querySelectorAll) return '';
            function cellText(cell) {
                if (!cell) return '';
                var t = cell.textContent.replace(/\r\n/g, '\n').replace(/\n/g, ' ');
                t = t.replace(/\s+/g, ' ').trim();
                return t.replace(/\|/g, '\\|');
            }
            var rowArrays = [];
            tableEl.querySelectorAll('tr').forEach(function(tr) {
                var cells = [];
                tr.querySelectorAll('td, th').forEach(function(cell) {
                    cells.push(cellText(cell));
                });
                if (cells.length) rowArrays.push(cells);
            });
            if (!rowArrays.length) return '';
            var numCols = 0;
            rowArrays.forEach(function(r) { numCols = Math.max(numCols, r.length); });
            function pad(r) {
                var out = r.slice();
                while (out.length < numCols) out.push('');
                return out;
            }
            rowArrays = rowArrays.map(pad);
            function rowLine(r) {
                return '| ' + r.join(' | ') + ' |';
            }
            var lines = [rowLine(rowArrays[0])];
            lines.push('|' + rowArrays[0].map(function() { return ' --- '; }).join('|') + '|');
            for (var i = 1; i < rowArrays.length; i++) {
                lines.push(rowLine(rowArrays[i]));
            }
            return lines.join('\n');
        }
        function extractTextWithTables(el) {
            var parts = [];
            function walk(node) {
                if (!node) return;
                if (node.nodeType === 3) {
                    parts.push(node.textContent);
                    return;
                }
                if (node.nodeType === 1) {
                    if (node.classList && node.classList.contains('q-table')) {
                        var table = node.querySelector('table');
                        if (table) {
                            var md = formatTableAsMarkdown(table);
                            if (md) parts.push('\n\n' + md + '\n\n');
                        }
                        return;
                    }
                    if (node.tagName === 'BR') {
                        parts.push('\n');
                        return;
                    }
                    for (var i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
                }
            }
            walk(el);
            return parts.join('').trim();
        }
        function captureCardCopyText(container) {
            var cards = container.querySelectorAll('.question-card');
            cards.forEach(function(card) {
                var qNumberEl = card.querySelector('.q-number');
                var qNumber = qNumberEl ? qNumberEl.textContent.trim() : '';
                var qTopicEl = card.querySelector('.q-topic');
                var qTopic = qTopicEl ? qTopicEl.textContent.trim() : '';
                var qText = '';
                Array.prototype.forEach.call(card.children, function(child) {
                    if (child.classList && child.classList.contains('q-text')) {
                        var t = extractTextWithTables(child);
                        if (t) qText += t + '\n';
                    } else if (child.classList && child.classList.contains('q-table')) {
                        var t = formatTableAsMarkdown(child.querySelector('table'));
                        if (t) qText += t + '\n\n';
                    }
                });
                qText = qText.trim();
                var qContextEl = card.querySelector('.q-context');
                var qContext = qContextEl ? extractTextWithTables(qContextEl) + '\n\n' : '';
                var options = [];
                card.querySelectorAll('.option-item').forEach(function(item) {
                    var t = item.textContent.trim();
                    if (t) options.push(t);
                });
                var out = '';
                if (qContext) out += qContext;
                if (qNumber)  out += qNumber + ' ';
                if (qTopic)   out += qTopic + '\n';
                if (qText)    out += qText + '\n\n';
                if (options.length) {
                    out += 'Options:\n';
                    options.forEach(function(o) { out += o + '\n'; });
                }
                card._latexCopyText = out.trim();
            });
        }

        // Wrap option content nodes into a dedicated container (.opt-content)
        // so we can apply width and wrapping rules consistently.
        function wrapOptionContent(container) {
            var optionItems = container.querySelectorAll('.option-item');
            optionItems.forEach(function(item) {
                // Skip if already wrapped
                if (item.querySelector('.opt-content')) return;

                var label = item.querySelector('.opt-label');
                var wrapper = document.createElement('div');
                wrapper.className = 'opt-content';

                // Move all nodes except the label into wrapper
                var child = item.firstChild;
                while (child) {
                    var next = child.nextSibling;
                    if (label && child === label) {
                        // keep label in place
                    } else {
                        try { wrapper.appendChild(child); } catch (e) {}
                    }
                    child = next;
                }

                // Append wrapper to the item (after label)
                item.appendChild(wrapper);
            });
        }

        /** Plain-text question for copy / Ask AI (LaTeX when _latexCopyText is set). */
        function buildQuestionPlainTextForCopy(card) {
            var formattedText = card._latexCopyText || '';
            if (!formattedText) {
                formattedText = '';
                var qNumberEl = card.querySelector('.q-number');
                var qNumber = qNumberEl ? qNumberEl.textContent.trim() : '';
                var qTopicEl = card.querySelector('.q-topic');
                var qTopic = qTopicEl ? qTopicEl.textContent.trim() : '';
                var qText = '';
                Array.prototype.forEach.call(card.children, function(child) {
                    if (child.classList && child.classList.contains('q-text')) {
                        var text = extractTextWithTables(child);
                        if (text) qText += text + '\n';
                    } else if (child.classList && child.classList.contains('q-table')) {
                        var t = formatTableAsMarkdown(child.querySelector('table'));
                        if (t) qText += t + '\n\n';
                    }
                });
                qText = qText.trim();
                var qContextEl = card.querySelector('.q-context');
                var qContext = qContextEl ? extractTextWithTables(qContextEl) + '\n\n' : '';
                var options = [];
                card.querySelectorAll('.option-item').forEach(function(item) {
                    var optText = item.textContent.trim();
                    if (optText) options.push(optText);
                });
                if (qContext) formattedText += qContext;
                if (qNumber)  formattedText += qNumber + ' ';
                if (qTopic)   formattedText += qTopic + '\n';
                if (qText)    formattedText += qText + '\n\n';
                if (options.length) {
                    formattedText += 'Options:\n';
                    options.forEach(function(opt) { formattedText += opt + '\n'; });
                }
                formattedText = formattedText.trim();
            }
            return formattedText;
        }

        function copyQuestionText(card, button) {
            try {
                var formattedText = buildQuestionPlainTextForCopy(card);

                // Copy to clipboard
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(formattedText).then(function() {
                        showCopySuccess(button);
                    }).catch(function(err) {
                        console.error('Failed to copy:', err);
                        fallbackCopy(formattedText, button);
                    });
                } else {
                    fallbackCopy(formattedText, button);
                }
            } catch (error) {
                console.error('Error copying question:', error);
            }
        }

        function showCopySuccess(button) {
            var originalHTML = button.innerHTML;
            button.classList.add('copied');
            // Same circular checkmark icon as show answer button, but green
            button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#7c3aed" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>';
            button.setAttribute('data-tooltip', 'Copied!');
            setTimeout(function() {
                button.classList.remove('copied');
                button.innerHTML = originalHTML;
                button.setAttribute('data-tooltip', 'Copy');
            }, 2000);
        }

        function fallbackCopy(text, button) {
            // Fallback for older browsers
            var textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showCopySuccess(button);
            } catch (err) {
                console.error('Fallback copy failed:', err);
            }
            document.body.removeChild(textArea);
        }

        function copyExplanationContent(card, qNumber, button) {
            var text = getEffectiveExplanation(currentPaper, sectionToExplanationsKey[currentSection], currentYear, qNumber) || '';
            if (!text) {
                showCorrectionToast('No explanation to copy');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showCopySuccess(button);
                }).catch(function() {
                    fallbackCopy(text, button);
                });
            } else {
                fallbackCopy(text, button);
            }
        }

        // Load content using fetch (works on both desktop and mobile)
        function loadContent() {
            if (appMode === 'notes') return;
            var viewer = document.getElementById('year-viewer');
            var filename = buildFilename();
            
            // Show loading state
            viewer.innerHTML = [
                '<div class="qb-loader">',
                '  <div class="qb-loader-ring-wrap">',
                '    <div class="qb-loader-ring-bg"></div>',
                '    <div class="qb-loader-ring-mid"></div>',

            // Function to process loaded HTML
            function processHTML(html) {
                // Extract body content from the HTML
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');

                var layoutHtml = '<div class="questions-layout" id="questions-layout">' +

                    '</button></div>' +

                    '<main class="questions-main-content">' + bodyContent + '</main></div>';

                viewer.innerHTML = layoutHtml;

                var mainContent = viewer.querySelector('.questions-main-content');
                var container = mainContent || viewer;

                // Apply question edits (admin overrides) before MathJax
                applyQuestionEdits(container);

                // Capture raw human-readable content (LaTeX, etc.) BEFORE MathJax transforms it
                captureRawQuestionContent(container);

                // Normalize option markup first, then capture LaTeX source
                wrapOptionContent(container);
                // Capture LaTeX source text BEFORE MathJax replaces text nodes
                captureCardCopyText(container);

                // Build questions sidebar and add ids + header actions to cards
                buildQuestionsSidebar(container);
                
                // Initialize MathJax FIRST, then add buttons AFTER MathJax is done
                function initMathJaxInViewer() {
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        var mathJaxReady = Promise.resolve();
                        if (window.MathJax.startup && window.MathJax.startup.promise) {
                            mathJaxReady = window.MathJax.startup.promise;
                        }
                        
                        mathJaxReady.then(function() {
                            if (window.MathJax.typesetClear) {
                                try {
                                    window.MathJax.typesetClear([viewer]);
                                } catch (e) {
                                    var mathElements = viewer.querySelectorAll('.MathJax, [id^="MathJax"]');
                                    mathElements.forEach(function(el) {
                                        try { el.remove(); } catch (e2) {}
                                    });
                                }
                            } else {
                                var mathElements = viewer.querySelectorAll('.MathJax, [id^="MathJax"]');
                                mathElements.forEach(function(el) {
                                    try { el.remove(); } catch (e) {}
                                });
                            }
                            
                            return window.MathJax.typesetPromise([viewer]);
                        }).then(function() {
                            addHeaderActionsToCards(container);
                        }).catch(function(err) {
                            console.error('MathJax error:', err);
                            addHeaderActionsToCards(container);
                        });
                    } else {
                        setTimeout(initMathJaxInViewer, 100);
                    }
                }
                
                setTimeout(initMathJaxInViewer, 200);
            }
            
            // Function to show error
            function showError(error) {
                console.error('Error loading file:', error);
                var isFileProtocol = window.location.protocol === 'file:';
                var errorMessage = isFileProtocol 
                    ? '<div style="text-align:center; padding:40px; color:#d32f2f; max-width:600px; margin:0 auto;">' +
                      '<p style="font-size:1.2em; font-weight:bold; margin-bottom:15px;">⚠️ Cannot Load Questions</p>' +
                      '<p style="font-size:0.95em; margin-bottom:15px; color:#333;">' +
                      'To load local files, use a local web server instead of opening directly.</p>' +
                      '<p style="font-size:0.9em; margin-top:20px; padding:15px; background:#e3f2fd; border-radius:8px; color:#1976d2;">' +
                      '<strong>✅ Solution: Use a Local Web Server</strong><br><br>' +
                      '1. Open terminal in this folder<br>' +
                      '2. Run: <code>python3 -m http.server 8000</code><br>' +
                      '3. Go to: <code>http://localhost:8000/main.html</code><br><br>' +
                      'Or double-click <code>start-server.sh</code> for easy setup!' +
                      '</p>' +
                      '<p style="font-size:0.85em; margin-top:15px; color:#666;">' +
                      'File attempted: ' + filename + '</p>' +
                      '</div>'
                    : '<div style="text-align:center; padding:40px; color:#d32f2f;">' +
                      '<p><strong>Error loading questions</strong></p>' +
                      '<p style="font-size:0.9em; margin-top:10px;">File: ' + filename + '</p>' +
                      '<p style="font-size:0.85em; margin-top:10px; color:#666;">' +
                      'Make sure all HTML files are in the same folder.</p>' +
                      '</div>';
                viewer.innerHTML = errorMessage;
            }
            
            // Try fetch first, fallback to XHR
            if (typeof fetch !== 'undefined') {
                var cacheBuster = '?t=' + new Date().getTime();
                fetch(filename + cacheBuster, {
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
                })
                    .then(function(response) {
                        if (!response.ok) throw new Error('File not found: ' + filename);
                        return response.text();
                    })
                    .then(processHTML)
                    .catch(function() { tryXHR(); });
            } else {
                tryXHR();
            }
            
            function tryXHR() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', filename, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 0 || xhr.status === 200) {
                            processHTML(xhr.responseText);
                        } else {
                            showError('HTTP ' + xhr.status);
                        }
                    }
                };
                xhr.onerror = function() { showError('Network error'); };
                try { xhr.send(); } catch (e) { showError(e.message); }
            }
        }

                if (!qNumberEl) return;
                
                var qNumber = qNumberEl.textContent.trim().replace('.', '');
                var correctAnswer = getEffectiveAnswer(currentPaper, sectionKey, currentYear, qNumber) || yearAnswers[qNumber];

                answerBtn.setAttribute('aria-label', 'Show answer for question ' + qNumber);

        // Get effective answer (QUESTION_ANSWERS + localStorage corrections)
        function getEffectiveAnswer(paper, section, year, qNumber) {
            try {
                var corrections = JSON.parse(localStorage.getItem('iss_answer_corrections') || '{}');
                var p = corrections[paper];
                if (p && p[section] && p[section][year] && p[section][year][qNumber]) {
                    return p[section][year][qNumber];
                }
            } catch (e) {}
            var answers = QUESTION_ANSWERS[paper];
            if (!answers) return null;
            var sectionAnswers = answers[sectionToAnswerKey[section]];
            if (!sectionAnswers) return null;
            var yearAnswers = sectionAnswers[year];
            if (!yearAnswers) return null;
            return yearAnswers[qNumber] || null;
        }

        // Get effective question edit (QUESTION_EDITS + localStorage)
        function getEffectiveQuestionEdit(paper, section, year, qNumber) {
            try {
                var stored = JSON.parse(localStorage.getItem('iss_question_edits') || '{}');
                var p = stored[paper];
                if (p && p[section] && p[section][year] && p[section][year][qNumber]) {
                    return typeof p[section][year][qNumber] === 'string'
                        ? JSON.parse(p[section][year][qNumber])
                        : p[section][year][qNumber];
                }
            } catch (e) {}
            try {
                var edits = typeof QUESTION_EDITS !== 'undefined' ? QUESTION_EDITS : {};
                var p = edits[paper];
                if (p && p[section] && p[section][year] && p[section][year][qNumber]) {
                    var val = p[section][year][qNumber];
                    return typeof val === 'string' ? JSON.parse(val) : val;
                }
            } catch (e) {}
            return null;
        }

        // Cache raw question content (LaTeX, human-readable) before MathJax runs
        var rawQuestionCache = new WeakMap();

        function captureRawQuestionContent(container) {
            if (!container) return;
            var cards = container.querySelectorAll('.question-card');
            cards.forEach(function(card) {
                var topic = '';
                var topicEl = card.querySelector('.q-topic');
                if (topicEl) topic = topicEl.textContent.trim();
                var text = '';
                var textEls = card.querySelectorAll('.q-text');
                textEls.forEach(function(el, i) {
                    text += (i ? '\n\n' : '') + el.innerHTML;
                });
                var options = [];
                var optItems = card.querySelectorAll('.options-grid .option-item');
                optItems.forEach(function(opt, idx) {
                    if (idx >= 4) return;
                    var lbl = opt.querySelector('.opt-label');
                    var lblText = lbl ? lbl.textContent.replace(/[()]/g, '').trim().toLowerCase() : 'abcd'[idx];
                    var wrap = opt.querySelector('.opt-content');
                    var txt;
                    if (wrap) {
                        txt = wrap.innerHTML.trim();
                    } else {
                        var clone = opt.cloneNode(true);
                        var c = clone.querySelector('.opt-label');
                        if (c) c.remove();
                        txt = clone.innerHTML.trim();
                    }
                    options.push({ label: lblText || 'abcd'[idx], text: txt });
                });
                rawQuestionCache.set(card, { topic: topic, text: text, options: options });
            });
        }

        // Apply question edits to DOM (run after content is injected)
        function applyQuestionEdits(container) {
            if (!container) return;
            var secKey = sectionToAnswerKey[currentSection];
            var cards = container.querySelectorAll('.question-card');
            cards.forEach(function(card) {
                var qNumEl = card.querySelector('.q-number');
                if (!qNumEl) return;
                var qNumber = qNumEl.textContent.trim().replace('.', '');
                var edit = getEffectiveQuestionEdit(currentPaper, secKey, currentYear, qNumber);
                if (!edit) return;
                if (edit.topic) {
                    var topicEl = card.querySelector('.q-topic');
                    if (topicEl) topicEl.textContent = edit.topic;
                }
                if (edit.text) {
                    var textEls = card.querySelectorAll('.q-text');
                    if (textEls.length) {
                        textEls[0].innerHTML = edit.text;
                        for (var i = 1; i < textEls.length; i++) textEls[i].remove();
                    }
                }
                if (edit.options && edit.options.length >= 4) {
                    var optItems = card.querySelectorAll('.options-grid .option-item');
                    edit.options.slice(0, 4).forEach(function(opt, idx) {
                        if (optItems[idx]) {
                            var lbl = '(' + (opt.label || 'abcd'[idx]) + ')';
                            var wrap = optItems[idx].querySelector('.opt-content');
                            if (wrap) {
                                wrap.innerHTML = opt.text || '';
                            } else {
                                optItems[idx].innerHTML = '<span class="opt-label">' + lbl + '</span> ' + (opt.text || '');
                            }
                        }
                    });
                }
            });
        }

                button.setAttribute('data-tooltip', 'Show Answer');

        // When answer shown: (1) Wrong Answer? icon at top-right of options grid, (2) Collapsible Explanation with Edit Explanation only
        function showRevealedContent(card, qNumber) {

                wrap.innerHTML = '<button type="button" class="q-header-action-btn wrong-answer-trigger" data-tooltip="Wrong Answer?" aria-label="Wrong Answer?">' + wrongAnswerIcon + '</button><span class="wrong-answer-picker"><span class="wrong-answer-hint">Choose correct answer</span><span class="wrong-answer-chips"></span></span>';
                var pickerEl = wrap.querySelector('.wrong-answer-picker');

                ['a','b','c','d'].forEach(function(opt) {

            var collapsible = document.createElement('div');

            toggleLabel.innerHTML = '<span class="explanation-toggle-label">Explanation</span>';

            var copyIcon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
            var copyBtn = document.createElement('button');

            copyBtn.className = 'q-header-action-btn explanation-copy-btn';

            copyBtn.setAttribute('aria-label', 'Copy explanation');

            if (isAdmin()) {
                var explIcon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>';

            headerRight.appendChild(chevronBtn);

        function hideWrongAnswerSection(card) {
            var wrap = card.querySelector('.options-grid .wrong-answer-wrap');
            if (wrap) wrap.remove();
            var collapsible = card.querySelector('.explanation-collapsible');
            if (collapsible) collapsible.remove();
        }

        // Batch corrections to minimize GitHub commits (30s debounce)
        var correctionQueue = [];
        var correctionTimer = null;
        var CORRECTION_DEBOUNCE_MS = 15000;

        function persistToLocalStorage(paper, section, year, q, answer) {
            try {
                var corrections = JSON.parse(localStorage.getItem('iss_answer_corrections') || '{}');
                if (!corrections[paper]) corrections[paper] = {};
                if (!corrections[paper][section]) corrections[paper][section] = {};
                if (!corrections[paper][section][year]) corrections[paper][section][year] = {};
                corrections[paper][section][year][q] = answer;
                localStorage.setItem('iss_answer_corrections', JSON.stringify(corrections));
            } catch (e) {}
        }

        function flushCorrectionQueue() {
            if (correctionTimer) { clearTimeout(correctionTimer); correctionTimer = null; }
            if (correctionQueue.length === 0) return;
            var batch = correctionQueue.slice();
            correctionQueue = [];
            fetch('/api/correct', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ corrections: batch })
            }).then(function(r) { return r.json(); }).then(function(res) {
                if (res.ok) {
                    var n = res.count || batch.length;
                    showCorrectionToast(n === 1 ? 'Updated answers.js' : n + ' corrections saved to answers.js');
                } else {
                    batch.forEach(function(c) { persistToLocalStorage(c.paper, c.section, c.year, c.q, c.answer); });
                    showCorrectionToast('Save failed — stored locally');
                }
            }).catch(function() {
                batch.forEach(function(c) { persistToLocalStorage(c.paper, c.section, c.year, c.q, c.answer); });
                showCorrectionToast('Offline — stored locally');
            });
        }

        function saveCorrection(card, qNumber, answer, secKey, chipsEl) {
            if (QUESTION_ANSWERS[currentPaper] && QUESTION_ANSWERS[currentPaper][secKey] && QUESTION_ANSWERS[currentPaper][secKey][currentYear]) {
                QUESTION_ANSWERS[currentPaper][secKey][currentYear][qNumber] = answer;
            }
            applyCorrection(card, answer, chipsEl);

            var origin = window.location.origin;
            var canUseApi = origin && origin !== 'null' && origin !== 'file://';
            if (canUseApi) {
                var key = currentPaper + '|' + secKey + '|' + currentYear + '|' + qNumber;
                correctionQueue = correctionQueue.filter(function(c) { return c.key !== key; });
                correctionQueue.push({ paper: currentPaper, section: secKey, year: currentYear, q: qNumber, answer: answer, key: key });
                showCorrectionToast('Queued — saving in 15s');
                if (correctionTimer) clearTimeout(correctionTimer);
                correctionTimer = setTimeout(flushCorrectionQueue, CORRECTION_DEBOUNCE_MS);
            } else {
                saveToLocalStorage(card, qNumber, answer, secKey, chipsEl);
            }
        }

        window.addEventListener('beforeunload', function() {
            if (correctionQueue.length > 0 && navigator.sendBeacon) {
                var blob = new Blob([JSON.stringify({ corrections: correctionQueue })], { type: 'application/json' });
                navigator.sendBeacon('/api/correct', blob);
            }
        });

        function saveToLocalStorage(card, qNumber, answer, secKey, chipsEl) {
            try {
                var corrections = JSON.parse(localStorage.getItem('iss_answer_corrections') || '{}');
                if (!corrections[currentPaper]) corrections[currentPaper] = {};
                if (!corrections[currentPaper][secKey]) corrections[currentPaper][secKey] = {};
                if (!corrections[currentPaper][secKey][currentYear]) corrections[currentPaper][secKey][currentYear] = {};
                corrections[currentPaper][secKey][currentYear][qNumber] = answer;
                localStorage.setItem('iss_answer_corrections', JSON.stringify(corrections));
                applyCorrection(card, answer, chipsEl);
                showCorrectionToast('Saved (use server to update answers.js)');
            } catch (e) { showCorrectionToast('Failed'); }
        }

        function applyCorrection(card, answer, chipsEl) {
            chipsEl.querySelectorAll('.wrong-answer-chip').forEach(function(c) {
                c.classList.toggle('selected', c.getAttribute('data-opt') === answer);
            });
            var options = card.querySelectorAll('.option-item');
            options.forEach(function(opt) {
                opt.classList.remove('correct-answer');
                var label = opt.querySelector('.opt-label');
                if (label && label.textContent.toLowerCase().includes('(' + answer + ')')) {
                    opt.classList.add('correct-answer');
                }
            });
        }

        function showCorrectionToast(msg) {
            var toast = document.createElement('div');
            toast.className = 'correction-toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { toast.classList.add('show'); }, 10);
            setTimeout(function() {
                toast.classList.remove('show');
                setTimeout(function() { toast.remove(); }, 300);
            }, 2500);
        }
    </script>

    <!-- Explanations functionality (shown with answer, below Wrong Answer?) -->
    <script>
        var sectionToExplanationsKey = sectionToAnswerKey;

        function getEffectiveExplanation(paper, section, year, qNumber) {
            try {
                var edits = JSON.parse(localStorage.getItem('iss_explanation_edits') || '{}');
                if (Object.keys(edits).length === 0) {
                    var legacy = localStorage.getItem('iss_note_edits');
                    if (legacy) { localStorage.setItem('iss_explanation_edits', legacy); edits = JSON.parse(legacy); }
                }
                var p = edits[paper];
                if (p && p[section] && p[section][year] && p[section][year][qNumber]) {
                    return p[section][year][qNumber];
                }
            } catch (e) {}
            if (typeof QUESTION_EXPLANATIONS === 'undefined') return null;
            var pnotes = QUESTION_EXPLANATIONS[paper];
            if (!pnotes) return null;
            var sec = pnotes[section];
            if (!sec) return null;
            var yearNotes = sec[year];
            if (!yearNotes) return null;
            return yearNotes[qNumber] || null;
        }

        // Explanations section: view mode (message/content) or edit mode (textarea + buttons). Add/Edit Explanation is in triggers row.
        function showNotesView(card, qNumber, notesWrap) {
            var noteText = getEffectiveExplanation(currentPaper, sectionToExplanationsKey[currentSection], currentYear, qNumber) || '';
            notesWrap.innerHTML = '<div class="q-notes-content">' + renderNoteHtml(noteText) + '</div>';
            var trigger = card.querySelector('.edit-explanation-trigger');
            if (trigger) {
                var label = noteText ? 'Edit Explanation' : 'Add Explanation';
                trigger.setAttribute('data-tooltip', label);
                trigger.setAttribute('aria-label', label);
            }
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([notesWrap]).catch(function(err) { console.warn('MathJax:', err); });
            }
        }

        function renderNoteHtml(text) {
            if (!text) return '<div class="q-notes-empty">No content available</div>';
            
            // 1. Protect MathJax LaTeX snippets (\[...\], \(...\), $$...$$, $...$)
            var placeholders = [];
            var s = text
                .replace(/\$\$[\s\S]*?\$\$/g, function(m) { var id = '%%LATEX_' + placeholders.length + '%%'; placeholders.push(m); return id; })
                .replace(/\\\[[\s\S]*?\\\]/g, function(m) { var id = '%%LATEX_' + placeholders.length + '%%'; placeholders.push(m); return id; })
                .replace(/\\\([\s\S]*?\\\)/g, function(m) { var id = '%%LATEX_' + placeholders.length + '%%'; placeholders.push(m); return id; })
                .replace(/\$[^$\n]+?\$/g, function(m) { var id = '%%LATEX_' + placeholders.length + '%%'; placeholders.push(m); return id; });

            // 2. Simple Markdown parsing
            var lines = s.split('\n');
            var resultHtml = '';
            var listStack = [];
            var inTable = false;
            var tableRows = [];

            function closeLists(toLevel) {
                while (listStack.length > toLevel) {
                    var type = listStack.pop();
                    resultHtml += (type === 'ul' ? '</ul>' : '</ol>');
                }
            }

            function renderTable() {
                if (tableRows.length > 0) {
                    resultHtml += '<div class="q-table"><table>';
                    tableRows.forEach((row, idx) => {
                        resultHtml += '<tr>';
                        row.forEach(cell => {
                            var tag = (idx === 0) ? 'th' : 'td';
                            resultHtml += `<${tag}>${parseInline(cell)}</${tag}>`;
                        });
                        resultHtml += '</tr>';
                    });
                    resultHtml += '</table></div>';
                    tableRows = [];
                }
                inTable = false;
            }

            function parseInline(txt) {
                if (!txt) return '';
                var t = txt.replace(/&/g, '&amp;')
                           .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                           .replace(/__(.*?)__/g, '<strong>$1</strong>')
                           .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                           .replace(/`(.*?)`/g, '<code>$1</code>');
                return t;
            }

            var inCodeBlock = false;
            var codeBlockLines = [];
            var inChartBlock = false;
            var chartBlockLines = [];

            for (var i = 0; i < lines.length; i++) {
                var rawLine = lines[i];
                var line = rawLine.trim();

                // Handle ```chart blocks — generates pure inline SVG
                if (!inCodeBlock && /^```chart\s*$/.test(line)) {
                    closeLists(0);
                    inChartBlock = true;
                    chartBlockLines = [];
                    continue;
                }
                if (inChartBlock) {
                    if (line === '```') {
                        try {
                            var chartCfg = JSON.parse(chartBlockLines.join('\n'));
                            resultHtml += buildNoteSVG(chartCfg);
                        } catch(e) {
                            resultHtml += '<div class="note-chart-error">Chart JSON error: ' + e.message + '</div>';
                        }
                        inChartBlock = false;
                        chartBlockLines = [];
                    } else {
                        chartBlockLines.push(rawLine);
                    }
                    continue;
                }

                // Handle Fenced Code Block (```)
                if (/^```(\w*)\s*$/.test(line)) {
                    if (inCodeBlock) {
                        closeLists(0);
                        var codeContent = codeBlockLines.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        resultHtml += '<pre class="note-code-block"><code>' + codeContent + '</code></pre>';
                        inCodeBlock = false;
                        codeBlockLines = [];
                    } else {
                        closeLists(0);
                        inCodeBlock = true;
                    }
                    continue;
                }
                if (inCodeBlock) {
                    codeBlockLines.push(rawLine);
                    continue;
                }

                // Handle Tables
                if (line.startsWith('|') && line.endsWith('|')) {
                    closeLists(0);
                    if (line.indexOf('---') === -1) {
                        var cells = line.split('|').slice(1, -1);
                        tableRows.push(cells.map(c => c.trim()));
                    }
                    inTable = true;
                    continue;
                } else if (inTable) {
                    renderTable();
                }

                if (!line) {
                    closeLists(0);
                    continue;
                }

                // Handle Horizontal Rule (---, ***, ___)
                if (/^(---|\*\*\*|___)\s*$/.test(line)) {
                    closeLists(0);
                    resultHtml += '<hr class="note-hr">';
                    continue;
                }

                // Handle Headers (# through ######) — check most # first
                var hMatch = line.match(/^(#{1,6})\s+(.*)$/);
                if (hMatch) {
                    closeLists(0);
                    var level = Math.min(hMatch[1].length, 6);
                    var hClass = 'note-h' + level;
                    resultHtml += `<h${level} class="${hClass}">${parseInline(hMatch[2].trim())}</h${level}>`;
                    continue;
                }

                // Handle Blockquote
                if (line.startsWith('>')) {
                    closeLists(0);
                    var bqContent = line.replace(/^>\s?/, '');
                    var bqClass = 'note-blockquote';
                    if (bqContent.includes('ISS tip:')) {
                        bqClass += ' tip-style';
                    }
                    resultHtml += `<blockquote class="${bqClass}">${parseInline(bqContent)}</blockquote>`;
                    continue;
                }

                // Handle Lists (including nested)
                var indentMatch = rawLine.match(/^(\s*)/);
                var indent = indentMatch ? indentMatch[1].length : 0;
                var level = Math.floor(indent / 2); // 2 spaces per level
                
                var listMatch = line.match(/^([-*]|\d+\.)\s+(.*)/);
                if (listMatch) {
                    var marker = listMatch[1];
                    var content = listMatch[2];
                    var type = (marker === '-' || marker === '*') ? 'ul' : 'ol';

                    if (listStack.length < level + 1) {
                        while (listStack.length < level + 1) {
                            var currentType = (listStack.length === level) ? type : 'ul';
                            var listClass = currentType === 'ul' ? 'note-list' : 'note-list note-ol';
                            resultHtml += `<${currentType} class="${listClass}">`;
                            listStack.push(currentType);
                        }
                    } else if (listStack.length > level + 1) {
                        closeLists(level + 1);
                    }

                    // Check if type changed at the same level
                    if (listStack.length > 0 && listStack[listStack.length - 1] !== type) {
                        resultHtml += (listStack.pop() === 'ul' ? '</ul>' : '</ol>');
                        var listClass = type === 'ul' ? 'note-list' : 'note-list note-ol';
                        resultHtml += `<${type} class="${listClass}">`;
                        listStack.push(type);
                    }

                    resultHtml += `<li>${parseInline(content)}</li>`;
                } else {
                    closeLists(0);
                    resultHtml += `<p class="note-p">${parseInline(line)}</p>`;
                }
            }
            
            closeLists(0);
            if (inTable) renderTable();
            if (inCodeBlock && codeBlockLines.length > 0) {

                    var acv = colVar(ann.color || 'danger');
                    if (ann.type === 'vline') {
                        var axv = sx(ann.x).toFixed(1);
                        g += '<line x1="' + axv + '" y1="' + mt + '" x2="' + axv + '" y2="' + (mt + ph) + '" stroke-dasharray="4,3" style="stroke:' + acv + ';stroke-width:1.5" clip-path="url(#' + id + ')"/>';
                        if (ann.label) g += '<text x="' + (parseFloat(axv) + 3) + '" y="' + (mt + 13) + '" style="font-size:8.5px;fill:' + acv + ';font-family:inherit">' + esc(ann.label) + '</text>';
                    } else if (ann.type === 'hline') {
                        var ayv = sy(ann.y).toFixed(1);
                        g += '<line x1="' + ml + '" y1="' + ayv + '" x2="' + (W - mr) + '" y2="' + ayv + '" stroke-dasharray="4,3" style="stroke:' + acv + ';stroke-width:1.5"/>';
                        if (ann.label) g += '<text x="' + (W - mr - 3) + '" y="' + (parseFloat(ayv) - 3) + '" text-anchor="end" style="font-size:8.5px;fill:' + acv + ';font-family:inherit">' + esc(ann.label) + '</text>';
                    }
                });

                var captionHtml = cfg.title ? '<p class="note-chart-caption">' + esc(cfg.title) + '</p>' : '';
                return '<div class="note-chart-wrap">' +
                    '<svg class="note-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>' +
                    buildLegend(datasets) + captionHtml + '</div>';
            }

            // ── SVG vertical bar chart ────────────────────────────────────
            function svgBar(cfg) {
                var W = 480, H = 256, ml = 52, mr = 14, mt = 14, mb = 42;
                var pw = W - ml - mr, ph = H - mt - mb;

                var labels = cfg.datasets ? cfg.labels || [] : [];
                var datasets = cfg.datasets || [];
                var n = labels.length;
                if (!n) return '';

                var allY = [];
                datasets.forEach(function(ds) { (ds.data || []).forEach(function(v) { if (v !== null && !isNaN(v)) allY.push(v); }); });
                var yMin = cfg.yMin !== undefined ? cfg.yMin : Math.min(0, Math.min.apply(null, allY));
                var yMax = cfg.yMax !== undefined ? cfg.yMax : (Math.max.apply(null, allY) * 1.15 || 1);
                if (yMin === yMax) yMax = yMin + 1;

                function sy(v) { return mt + ph * (1 - (v - yMin) / (yMax - yMin)); }
                var yBase = sy(0);
                var nDs = datasets.length;
                var gW = pw / n;
                var bW = Math.max(5, gW * 0.65 / nDs - 1);

                var g = '';
                var yTicks = niceTicks(yMin, yMax, 5);
                yTicks.forEach(function(ty) {
                    if (ty < yMin - 1e-9 || ty > yMax + 1e-9) return;
                    g += '<line x1="' + ml + '" y1="' + sy(ty).toFixed(1) + '" x2="' + (W - mr) + '" y2="' + sy(ty).toFixed(1) + '" stroke-dasharray="3,3" style="stroke:var(--border-mid);stroke-width:1"/>';
                });
                if (yMin < 0 && yMax > 0) g += '<line x1="' + ml + '" y1="' + sy(0).toFixed(1) + '" x2="' + (W - mr) + '" y2="' + sy(0).toFixed(1) + '" style="stroke:var(--text-muted);stroke-width:0.8"/>';
                g += '<line x1="' + ml + '" y1="' + mt + '" x2="' + ml + '" y2="' + (mt + ph) + '" style="stroke:var(--text-muted);stroke-width:1.5"/>';
                g += '<line x1="' + ml + '" y1="' + (mt + ph) + '" x2="' + (W - mr) + '" y2="' + (mt + ph) + '" style="stroke:var(--text-muted);stroke-width:1.5"/>';
                yTicks.forEach(function(ty) {
                    if (ty < yMin - 1e-9 || ty > yMax + 1e-9) return;
                    var yy = sy(ty).toFixed(1);
                    g += '<line x1="' + (ml - 4) + '" y1="' + yy + '" x2="' + ml + '" y2="' + yy + '" style="stroke:var(--text-muted);stroke-width:1"/>';
                    g += '<text x="' + (ml - 7) + '" y="' + (parseFloat(yy) + 3.5) + '" text-anchor="end" style="font-size:9.5px;fill:var(--text-muted);font-family:inherit">' + fmtN(ty) + '</text>';
                });
                labels.forEach(function(lbl, li) {
                    var cx = (ml + (li + 0.5) * gW).toFixed(1);
                    g += '<text x="' + cx + '" y="' + (mt + ph + 14) + '" text-anchor="middle" style="font-size:9px;fill:var(--text-muted);font-family:inherit">' + esc(String(lbl)) + '</text>';
                });
                if (cfg.xLabel) g += '<text x="' + (ml + pw / 2) + '" y="' + (H - 3) + '" text-anchor="middle" style="font-size:11px;fill:var(--text-context);font-family:inherit">' + esc(cfg.xLabel) + '</text>';
                if (cfg.yLabel) {
                    var ylx = ml - 38, yly = mt + ph / 2;
                    g += '<text x="' + ylx + '" y="' + yly + '" text-anchor="middle" transform="rotate(-90 ' + ylx + ' ' + yly + ')" style="font-size:11px;fill:var(--text-context);font-family:inherit">' + esc(cfg.yLabel) + '</text>';
                }
                datasets.forEach(function(ds, di) {
                    var colName = ds.color || AUTO_COLORS[di % AUTO_COLORS.length];
                    (ds.data || []).forEach(function(v, li) {
                        if (v === null || isNaN(v)) return;
                        var cn = (ds.colors && ds.colors[li]) ? ds.colors[li] : colName;
                        var cv = colVar(cn);
                        var bx = ml + li * gW + (nDs === 1 ? (gW - bW) / 2 : di * (bW + 1) + (gW - nDs * (bW + 1)) / 2);
                        var byTop = Math.min(yBase, sy(v)).toFixed(1);
                        var bh = Math.abs(yBase - sy(v)).toFixed(1);
                        g += '<rect x="' + bx.toFixed(1) + '" y="' + byTop + '" width="' + bW.toFixed(1) + '" height="' + bh + '" rx="2" style="fill:' + cv + ';fill-opacity:0.85"/>';
                    });
                });
                var captionHtml = cfg.title ? '<p class="note-chart-caption">' + esc(cfg.title) + '</p>' : '';
                return '<div class="note-chart-wrap">' +
                    '<svg class="note-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>' +
                    buildLegend(datasets) + captionHtml + '</div>';
            }

            // ── SVG horizontal bar chart ──────────────────────────────────
            function svgHBar(cfg) {
                var labels = cfg.labels || [], datasets = cfg.datasets || [], n = labels.length;
                var barH = 28, barGap = 10, ml = 112, mr = 52, mt = 14, mb = 34;
                var W = 480, H = mt + n * (barH + barGap) + mb;
                var pw = W - ml - mr;
                var allX = [];
                datasets.forEach(function(ds) { (ds.data || []).forEach(function(v) { if (v !== null && !isNaN(v)) allX.push(v); }); });
                var xMin = cfg.xMin !== undefined ? cfg.xMin : 0;
                var xMax = cfg.xMax !== undefined ? cfg.xMax : (allX.length ? Math.max.apply(null, allX) * 1.2 : 1);

                function sx(v) { return ml + (v - xMin) / (xMax - xMin) * pw; }
                var g = '';
                var xTicks = niceTicks(xMin, xMax, 5);
                xTicks.forEach(function(tx) {
                    var xx = sx(tx).toFixed(1);
                    g += '<line x1="' + xx + '" y1="' + mt + '" x2="' + xx + '" y2="' + (H - mb) + '" stroke-dasharray="3,3" style="stroke:var(--border-mid);stroke-width:1"/>';
                });
                g += '<line x1="' + ml + '" y1="' + mt + '" x2="' + ml + '" y2="' + (H - mb) + '" style="stroke:var(--text-muted);stroke-width:1.5"/>';
                g += '<line x1="' + ml + '" y1="' + (H - mb) + '" x2="' + (W - mr) + '" y2="' + (H - mb) + '" style="stroke:var(--text-muted);stroke-width:1.5"/>';
                xTicks.forEach(function(tx) {
                    var xx = sx(tx).toFixed(1);
                    g += '<line x1="' + xx + '" y1="' + (H - mb) + '" x2="' + xx + '" y2="' + (H - mb + 4) + '" style="stroke:var(--text-muted);stroke-width:1"/>';
                    g += '<text x="' + xx + '" y="' + (H - mb + 14) + '" text-anchor="middle" style="font-size:9.5px;fill:var(--text-muted);font-family:inherit">' + fmtN(tx) + '</text>';
                });
                labels.forEach(function(lbl, li) {
                    var cy = mt + li * (barH + barGap) + barH / 2;
                    g += '<text x="' + (ml - 7) + '" y="' + (cy + 4) + '" text-anchor="end" style="font-size:10px;fill:var(--text-context);font-family:inherit">' + esc(String(lbl)) + '</text>';
                });
                if (cfg.xLabel) g += '<text x="' + (ml + pw / 2) + '" y="' + (H - 3) + '" text-anchor="middle" style="font-size:11px;fill:var(--text-context);font-family:inherit">' + esc(cfg.xLabel) + '</text>';
                datasets.forEach(function(ds, di) {
                    var colName = ds.color || AUTO_COLORS[di % AUTO_COLORS.length];
                    (ds.data || []).forEach(function(v, li) {
                        if (v === null || isNaN(v)) return;
                        var cn = (ds.colors && ds.colors[li]) ? ds.colors[li] : colName;
                        var cv = colVar(cn);
                        var by2 = mt + li * (barH + barGap);
                        var bw2 = Math.max(0, sx(v) - ml);
                        g += '<rect x="' + ml + '" y="' + by2.toFixed(1) + '" width="' + bw2.toFixed(1) + '" height="' + barH + '" rx="3" style="fill:' + cv + ';fill-opacity:0.85"/>';
                        g += '<text x="' + (ml + bw2 + 5) + '" y="' + (by2 + barH / 2 + 4) + '" style="font-size:10px;font-weight:600;fill:' + cv + ';font-family:inherit">' + fmtN(v) + '</text>';
                    });
                });
                var captionHtml = cfg.title ? '<p class="note-chart-caption">' + esc(cfg.title) + '</p>' : '';
                return '<div class="note-chart-wrap">' +
                    '<svg class="note-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>' +
                    captionHtml + '</div>';
            }

            // ── Public entry point ────────────────────────────────────────
            window.buildNoteSVG = function(userCfg) {
                var cfg;
                if (userCfg.compute) {
                    var handler = COMPUTE[userCfg.compute];
                    if (!handler) return '<div class="note-chart-error">Unknown compute type: <code>' + esc(userCfg.compute) + '</code></div>';
                    cfg = handler(userCfg);
                    if (userCfg.title)  cfg.title  = userCfg.title;
                    if (userCfg.xLabel) cfg.xLabel = userCfg.xLabel;
                    if (userCfg.yLabel) cfg.yLabel = userCfg.yLabel;
                } else {
                    cfg = userCfg;
                }
                var type = cfg.type || 'line';
                if (type === 'bar')  return svgBar(cfg);
                if (type === 'hbar') return svgHBar(cfg);
                return svgLine(cfg);
            };

        })();

        var NOTE_FORMAT_HINT = '<details class="note-format-hint" open><summary>Formatting help</summary><div class="note-format-hint-body">' + NOTE_FORMAT_HINT_BODY + '</div></details>';

        // Queue & persist flow similar to answers corrections
        var noteEditQueue = [];
        var noteEditTimer = null;

        function persistNoteToLocalStorage(paper, section, year, q, note) {
            try {
                var edits = JSON.parse(localStorage.getItem('iss_explanation_edits') || '{}');
                if (!edits[paper]) edits[paper] = {};
                if (!edits[paper][section]) edits[paper][section] = {};
                if (!edits[paper][section][year]) edits[paper][section][year] = {};
                edits[paper][section][year][q] = note;
                localStorage.setItem('iss_explanation_edits', JSON.stringify(edits));
            } catch (e) {}
        }

        function flushNoteEditQueue() {
            if (noteEditTimer) { clearTimeout(noteEditTimer); noteEditTimer = null; }
            if (noteEditQueue.length === 0) return;
            var batch = noteEditQueue.slice();
            noteEditQueue = [];
            fetch('/api/explanations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ edits: batch })
            }).then(function(r) { return r.json(); }).then(function(res) {
                if (res.ok) {
                    showCorrectionToast(res.count === 1 ? 'Updated explanations.js' : (res.count + ' explanations saved to explanations.js'));
                } else {
                    batch.forEach(function(c) { persistNoteToLocalStorage(c.paper, c.section, c.year, c.q, c.note); });
                    showCorrectionToast('Save failed — stored locally');
                }
            }).catch(function() {
                batch.forEach(function(c) { persistNoteToLocalStorage(c.paper, c.section, c.year, c.q, c.note); });
                showCorrectionToast('Offline — stored locally');
            });
        }

        function saveNoteEdit(card, qNumber, noteText, options) {
            options = options || {};

            try {
                if (typeof QUESTION_EXPLANATIONS === 'undefined') window.QUESTION_EXPLANATIONS = {};
                if (!QUESTION_EXPLANATIONS[currentPaper]) QUESTION_EXPLANATIONS[currentPaper] = {};
                if (!QUESTION_EXPLANATIONS[currentPaper][secKey]) QUESTION_EXPLANATIONS[currentPaper][secKey] = {};
                if (!QUESTION_EXPLANATIONS[currentPaper][secKey][currentYear]) QUESTION_EXPLANATIONS[currentPaper][secKey][currentYear] = {};
                QUESTION_EXPLANATIONS[currentPaper][secKey][currentYear][qNumber] = noteText;
            } catch (e) {}
            if (!options.skipNotesViewRefresh) {
                var notesWrap = card.querySelector('.notes-wrap');
                if (notesWrap) showNotesView(card, qNumber, notesWrap);
            }

            var canUseApi = origin && origin !== 'null' && origin !== 'file://';
            if (canUseApi) {
                var key = currentPaper + '|' + secKey + '|' + currentYear + '|' + qNumber;

                noteEditQueue.push({ paper: currentPaper, section: secKey, year: currentYear, q: qNumber, note: noteText, key: key });
                showCorrectionToast('Queued — saving in 15s');

                noteEditTimer = setTimeout(flushNoteEditQueue, NOTE_DEBOUNCE_MS);

                persistNoteToLocalStorage(currentPaper, secKey, currentYear, qNumber, noteText);
                showCorrectionToast('Saved locally (use server to update explanations.js)');
