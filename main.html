                var opts = [
                    { label: 'a', text: document.getElementById('q-edit-opt-a').value.trim() },
                    { label: 'b', text: document.getElementById('q-edit-opt-b').value.trim() },
                    { label: 'c', text: document.getElementById('q-edit-opt-c').value.trim() },
                    { label: 'd', text: document.getElementById('q-edit-opt-d').value.trim() }
                ];
                saveQuestionEdit(card, qNumber, topicVal, textVal, opts);
                modal.remove();
            });
            modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
            document.getElementById('q-edit-topic').focus();
        }

        function saveQuestionEdit(card, qNumber, topic, text, options) {
            var secKey = sectionToAnswerKey[currentSection];
            var payload = { text: text, topic: topic, options: options };
            try {
                if (typeof QUESTION_EDITS === 'undefined') window.QUESTION_EDITS = {};
                if (!QUESTION_EDITS[currentPaper]) QUESTION_EDITS[currentPaper] = {};
                if (!QUESTION_EDITS[currentPaper][secKey]) QUESTION_EDITS[currentPaper][secKey] = {};
                if (!QUESTION_EDITS[currentPaper][secKey][currentYear]) QUESTION_EDITS[currentPaper][secKey][currentYear] = {};
                QUESTION_EDITS[currentPaper][secKey][currentYear][qNumber] = JSON.stringify(payload);
            } catch (e) {}
            var viewer = card.closest('#year-viewer') || document.getElementById('year-viewer');
            if (viewer && card.closest('#year-viewer')) {
                var topicEl = card.querySelector('.q-topic');
                if (topicEl) topicEl.textContent = topic;
                var textEls = card.querySelectorAll('.q-text');
                if (textEls.length && text) { textEls[0].innerHTML = text; for (var i = 1; i < textEls.length; i++) textEls[i].remove(); }
                var optItems = card.querySelectorAll('.options-grid .option-item');
                options.forEach(function(opt, idx) {
                    if (optItems[idx]) {
                        var lbl = optItems[idx].querySelector('.opt-label');
                        var wrap = optItems[idx].querySelector('.opt-content');
                        var label = lbl ? lbl.textContent : '(' + (opt.label || 'abcd'[idx]) + ')';
                        if (wrap) {
                            wrap.innerHTML = opt.text || '';
                        } else {
                            optItems[idx].innerHTML = '<span class="opt-label">' + label + '</span>' + (opt.text || '');
                        }
                    }
                });
                if (window.MathJax && window.MathJax.typesetPromise) {
                    try { window.MathJax.typesetPromise([card]); } catch (e) {}
                }
            }
            var origin = window.location.origin;
            var canUseApi = origin && origin !== 'null' && origin !== 'file://';
            if (canUseApi) {
                var key = currentPaper + '|' + secKey + '|' + currentYear + '|' + qNumber;
                questionEditQueue = questionEditQueue.filter(function(c) { return c.key !== key; });
                questionEditQueue.push({ paper: currentPaper, section: secKey, year: currentYear, q: qNumber, text: text, topic: topic, options: options, key: key });
                showCorrectionToast('Queued — saving in 15s');
                if (questionEditTimer) clearTimeout(questionEditTimer);
                questionEditTimer = setTimeout(flushQuestionEditQueue, QUESTION_EDIT_DEBOUNCE_MS);
            } else {
                persistQuestionEditToLocalStorage(currentPaper, secKey, currentYear, qNumber, payload);
                showCorrectionToast('Saved locally (use server to update question_edits.js)');
            }
        }

        // ─── Revision Notes Editor ──────────────────────────────────────────
        var revisionNoteQueue = [];
        var revisionNoteTimer = null;
        var REVISION_NOTE_DEBOUNCE_MS = 15000;

        var revisionFullEditor = {
            type: null,
            sectionId: null,
            originalContent: '',
            originalLabel: '',
            explanationCard: null,
            explanationQNumber: null,
            previewTimer: null,
            keyHandler: null
        };

        function revisionEditorPaperLabel() {
            var m = { paper1: 'Paper I', paper2: 'Paper II', paper3: 'Paper III', paper4: 'Paper IV' };
            return m[currentPaper] || currentPaper;
        }

        function revisionEditorTopicTitle() {
            var d = REVISION_NOTES[currentPaper] && REVISION_NOTES[currentPaper][currentSection];
            return (d && d.title) ? d.title : String(currentSection || '');
        }

        function escapeRevisionEditorAttr(s) {
            return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        }

        function destroyRevisionEditorPreviewMath(el) {
            if (!el) return;
            if (window.MathJax && window.MathJax.typesetClear) {
                try { window.MathJax.typesetClear([el]); } catch (e) {}
            }
        }

        function flushRevisionEditorPreview() {
            revisionFullEditor.previewTimer = null;
            var el = document.getElementById('revision-editor-preview');
            if (!el) return;
            var raw = (document.getElementById('revision-editor-source') || {}).value || '';
            destroyRevisionEditorPreviewMath(el);
            el.innerHTML = renderNoteHtml(raw);
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([el]).catch(function(err) { console.warn('MathJax preview:', err); });
            }
        }

        function scheduleRevisionEditorPreview() {
            if (revisionFullEditor.previewTimer) clearTimeout(revisionFullEditor.previewTimer);
            revisionFullEditor.previewTimer = setTimeout(flushRevisionEditorPreview, 240);
        }

        function setRevisionEditorLayout(mode) {
            var body = document.getElementById('revision-editor-body');
            if (!body) return;
            body.className = 'revision-editor-body revision-editor-layout-' + mode;
            document.querySelectorAll('.revision-editor-layout-btn').forEach(function(btn) {
                var m = btn.getAttribute('data-layout');
                var on = m === mode;
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
                btn.classList.toggle('is-active', on);
            });
        }

        function isRevisionEditorDirty() {
            var srcEl = document.getElementById('revision-editor-source');
            if (!srcEl) return false;
            if (srcEl.value !== revisionFullEditor.originalContent) return true;
            if (revisionFullEditor.type === 'section') {
                var lblEl = document.getElementById('revision-editor-label');
                var cur = lblEl ? lblEl.value.trim() : '';
                var orig = (revisionFullEditor.originalLabel || '').trim();
                if (cur !== orig) return true;
            }
            return false;
        }

        function explanationEditorBreadcrumb(qNumber) {
            var paper = revisionEditorPaperLabel();
            var secEl = document.getElementById('section-select');
            var secName = (secEl && secEl.options && secEl.selectedIndex >= 0)
                ? secEl.options[secEl.selectedIndex].text.replace(/\s+/g, ' ').trim()
                : String(currentSection || '');
            var setLetterEl = document.getElementById('set-letter');
            var setPart = (setLetterEl && setLetterEl.textContent)
                ? ('Set ' + setLetterEl.textContent.trim() + ' · ')
                : '';
            return escapeRevisionEditorAttr(paper + ' · ' + secName + ' · ' + setPart + currentYear + ' · Q' + qNumber);
        }

        /** Prior sibling card that only carries shared context (matches copy / Ask AI preamble). */
        function isContextOnlyPreambleCard(el) {
            if (!el || !el.classList || !el.classList.contains('question-card')) return false;
            if (el.querySelector('.q-header')) return false;
            return !!el.querySelector('.q-context');
        }

        function collectPrecedingContextPreambleCards(card) {
            var list = [];
            var prev = card.previousElementSibling;
            while (prev && isContextOnlyPreambleCard(prev)) {
                list.unshift(prev);
                prev = prev.previousElementSibling;
            }
            return list;
        }

        /** Same document order as captureCardCopyText / buildQuestionPlainTextForCopy: q-context, q-text, q-table siblings, then options. */
        function buildExplanationQuestionExpandBodyDom(card) {
            var body = document.createElement('div');
            body.className = 'revision-editor-question-expand-body';
            body.setAttribute('aria-hidden', 'true');
            collectPrecedingContextPreambleCards(card).forEach(function(preambleCard) {
                var ctx = preambleCard.querySelector('.q-context');
                if (ctx) body.appendChild(ctx.cloneNode(true));
            });
            Array.prototype.forEach.call(card.children, function(child) {
                if (!child.classList) return;
                if (child.classList.contains('q-header')) return;
                if (child.classList.contains('explanation-collapsible')) return;
                if (child.classList.contains('q-context') ||
                    child.classList.contains('q-text') ||
                    child.classList.contains('q-table')) {
                    body.appendChild(child.cloneNode(true));
                    return;
                }
                if (child.classList.contains('options-grid')) {
                    var ogc = child.cloneNode(true);
                    ogc.querySelectorAll('.wrong-answer-wrap').forEach(function(n) { n.remove(); });
                    body.appendChild(ogc);
                }
            });
            return body;
        }

        /** Collapsible question context: summary row = real q-header (number + topic) + chevron; expanded = full stem + options (tables, multiple q-text, shared context). */
        function buildExplanationQuestionHeroHtml(card, qNumber) {
            var qh = card.querySelector('.q-header');
            var headerHtml = '';
            if (qh) {
                var hc = qh.cloneNode(true);
                hc.querySelectorAll('.q-header-actions').forEach(function(n) { n.remove(); });
                hc.querySelectorAll('button').forEach(function(n) { n.remove(); });
                headerHtml = hc.outerHTML;
            } else {
                headerHtml = '<div class="q-header"><span class="q-number">' + escapeRevisionEditorAttr(String(qNumber)) + '.</span></div>';
            }
            var body = buildExplanationQuestionExpandBodyDom(card);
            return (
                '<details class="revision-editor-question-hero-wrap">' +
                '<summary class="revision-editor-question-hero-summary" aria-label="Show or hide question text and options">' +
                '<div class="revision-editor-question-hero-summary-head">' + headerHtml + '</div>' +
                '<span class="revision-editor-question-hero-summary-right" aria-hidden="true">' +
                '<span class="revision-editor-question-hero-summary-chevron"></span></span></summary>' +
                '<div class="revision-editor-question-hero">' + body.outerHTML + '</div></details>'
            );
        }

        function showExplanationFullEditor(card, qNumber, notesWrap) {
            if (!card || !qNumber) return;
            var secKey = sectionToExplanationsKey[currentSection];
            var text = getEffectiveExplanation(currentPaper, secKey, currentYear, qNumber) || '';
            revisionFullEditor.type = 'explanation';
            revisionFullEditor.sectionId = null;
            revisionFullEditor.explanationCard = card;
            revisionFullEditor.explanationQNumber = qNumber;
            revisionFullEditor.originalContent = text;
            revisionFullEditor.originalLabel = '';

            var bc = explanationEditorBreadcrumb(qNumber);
            var heroHtml = buildExplanationQuestionHeroHtml(card, qNumber);
            var markup = buildRevisionEditorMarkup(bc, '', 'Save', {
                titleLabel: '',

                heroHtml: heroHtml
            });
            openRevisionEditorOverlay(markup, function() {
                var src = document.getElementById('revision-editor-source');
                if (src) src.value = text;
                var det = document.querySelector('#revision-editor-overlay .revision-editor-question-hero-wrap');
                if (det) {
                    det.open = !window.matchMedia('(max-width: 720px)').matches;
                }
                var ov = document.getElementById('revision-editor-overlay');
                if (ov && window.MathJax && window.MathJax.typesetPromise) {
                    var mjRoots = ov.querySelectorAll('.revision-editor-question-hero-wrap');
                    if (mjRoots.length) {
                        window.MathJax.typesetPromise(Array.from(mjRoots)).catch(function(err) {
                            console.warn('MathJax question hero:', err);
                        });
                    }
                }
            }, 'revision-editor-panel--question-explanation');
            var saveBtn = document.getElementById('revision-editor-save');
            if (saveBtn) saveBtn.addEventListener('click', saveExplanationFromRevisionEditor);

        function saveExplanationFromRevisionEditor() {
            if (revisionFullEditor.type !== 'explanation') return;
            var card = revisionFullEditor.explanationCard;
            var qNumber = revisionFullEditor.explanationQNumber;
            var src = document.getElementById('revision-editor-source');
            if (!card || !qNumber || !src) {
                teardownRevisionNoteEditor();
                return;
            }
            var val = src.value.trim();
            saveNoteEdit(card, qNumber, val, { skipNotesViewRefresh: true });
            teardownRevisionNoteEditor();
            var nw = card.querySelector('.notes-wrap');
            if (nw) showNotesView(card, qNumber, nw);
        }

        function teardownRevisionNoteEditor() {
            if (revisionFullEditor.previewTimer) {
                clearTimeout(revisionFullEditor.previewTimer);
                revisionFullEditor.previewTimer = null;
            }
            if (revisionFullEditor.keyHandler) {
                document.removeEventListener('keydown', revisionFullEditor.keyHandler);
                revisionFullEditor.keyHandler = null;
            }
            var prev = document.getElementById('revision-editor-preview');
            destroyRevisionEditorPreviewMath(prev);
            var ov = document.getElementById('revision-editor-overlay');
            if (ov) ov.remove();
            document.body.classList.remove('revision-editor-open');
            revisionFullEditor.type = null;
            revisionFullEditor.sectionId = null;
            revisionFullEditor.explanationCard = null;
            revisionFullEditor.explanationQNumber = null;
        }

            if (isRevisionEditorDirty()) {

            teardownRevisionNoteEditor();

        function openRevisionEditorOverlay(markup, wireCallback, panelExtraClass) {
            if (document.getElementById('revision-editor-overlay')) teardownRevisionNoteEditor();
            var overlay = document.createElement('div');
            overlay.id = 'revision-editor-overlay';
            overlay.className = 'revision-editor-overlay';
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-modal', 'true');
            var panelClass = 'revision-editor-panel' + (panelExtraClass ? ' ' + String(panelExtraClass).trim() : '');
            overlay.innerHTML = '<div class="' + panelClass + '">' + markup + '</div>';
            document.body.appendChild(overlay);
            var source = document.getElementById('revision-editor-source');
            if (!source) return;
            if (wireCallback) wireCallback();
            source.addEventListener('input', scheduleRevisionEditorPreview);
            document.body.classList.add('revision-editor-open');
            revisionFullEditor.keyHandler = function(ev) {
                if (ev.key !== 'Escape') return;
                if (document.querySelector('.note-confirm-overlay')) return;
                ev.preventDefault();
                requestCloseRevisionNoteEditor();
            };
            document.addEventListener('keydown', revisionFullEditor.keyHandler);
            var cancelBtn = document.getElementById('revision-editor-cancel');
            var closeBtn = document.getElementById('revision-editor-close-btn');
            if (cancelBtn) cancelBtn.addEventListener('click', requestCloseRevisionNoteEditor);
            if (closeBtn) closeBtn.addEventListener('click', requestCloseRevisionNoteEditor);
            overlay.addEventListener('click', function(ev) {
                if (ev.target === overlay) requestCloseRevisionNoteEditor();
            });
            document.querySelectorAll('.revision-editor-layout-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    setRevisionEditorLayout(btn.getAttribute('data-layout') || 'split');
                });
            });
            setRevisionEditorLayout('split');
            flushRevisionEditorPreview();
            source.focus();
        }

        function showAddSectionForm() {
            const viewer = document.getElementById('year-viewer');
            const paperData = REVISION_NOTES[currentPaper] || {};
            const data = paperData[currentSection] || { title: currentSection, sections: [] };
            
            // Create a modal-like overlay for adding a section
            const modal = document.createElement('div');
            modal.className = 'note-modal-overlay';
            modal.innerHTML = `
                <div class="note-modal-card">
                    <h3>Add New Revision Section</h3>
                    <div class="note-field">
                        <label>Section Label (Display Name)</label>
                        <input type="text" id="new-section-label" placeholder="e.g. Standard Discrete Distributions">
                    </div>
                    <div class="note-field">
                        <label>Section ID (URL Fragment)</label>
                        <input type="text" id="new-section-id" placeholder="e.g. discrete-dist">
                    </div>
                    <div class="note-editor-actions">
                        <button class="note-cancel-btn" onclick="this.closest('.note-modal-overlay').remove()">Cancel</button>
                        <button class="note-save-btn" onclick="createNewSection()">Create Section</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            const labelInput = document.getElementById('new-section-label');
            const idInput = document.getElementById('new-section-id');
            
            labelInput.addEventListener('input', () => {
                if (!idInput._manuallyEdited) {
                    idInput.value = labelInput.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
                }
            });
            idInput.addEventListener('input', () => { idInput._manuallyEdited = true; });
            labelInput.focus();
        }

        function createNewSection() {
            const label = document.getElementById('new-section-label').value.trim();
            const id = document.getElementById('new-section-id').value.trim();
            
            if (!label || !id) {
                alert('Both Label and ID are required.');
                return;
            }

            if (!REVISION_NOTES[currentPaper]) REVISION_NOTES[currentPaper] = {};
            if (!REVISION_NOTES[currentPaper][currentSection]) {
                REVISION_NOTES[currentPaper][currentSection] = {
                    title: currentSection.charAt(0).toUpperCase() + currentSection.slice(1),
                    sections: [],
                    tips: ""
                };
            }
            
            const data = REVISION_NOTES[currentPaper][currentSection];
            if (data.sections.find(s => s.id === id)) {
                alert('A section with this ID already exists.');
                return;
            }

            const newSec = { id, label, content: "New section content..." };
            data.sections.push(newSec);
            
            // Remove modal
            document.querySelector('.note-modal-overlay').remove();
            
            // Re-render and open editor
            renderRevisionNotes();
            showNoteSectionEditor(id);
            
            // Queue empty update to server to create the entry
            queueNoteUpdate(currentPaper, currentSection, id, newSec.content, label);
        }

        function showNoteSectionEditor(sectionId) {
            const data = REVISION_NOTES[currentPaper][currentSection];
            const section = data.sections.find(s => s.id === sectionId);
            if (!section) return;

            var target = document.getElementById(sectionId);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });

            revisionFullEditor.type = 'section';
            revisionFullEditor.sectionId = sectionId;
            revisionFullEditor.originalContent = section.content;
            revisionFullEditor.originalLabel = section.label;

            var bc = escapeRevisionEditorAttr(revisionEditorPaperLabel() + ' · ' + revisionEditorTopicTitle());
            var titleSlot = '<input type="text" id="revision-editor-label" class="revision-editor-title-input" autocomplete="off" aria-label="Section title" />';
            var markup = buildRevisionEditorMarkup(bc, titleSlot, 'Save', { titleLabel: 'Section title' });
            openRevisionEditorOverlay(markup, function() {
                document.getElementById('revision-editor-label').value = section.label;
                document.getElementById('revision-editor-source').value = section.content;
            });
            document.getElementById('revision-editor-save').addEventListener('click', function() {
                saveNoteSection(sectionId);
            });
        }

        function saveNoteSection(sectionId) {
            if (revisionFullEditor.type !== 'section' || revisionFullEditor.sectionId !== sectionId) return;
            const textarea = document.getElementById('revision-editor-source');
            const labelInput = document.getElementById('revision-editor-label');
            if (!textarea || !labelInput) return;

            const newContent = textarea.value;
            const newLabel = labelInput.value.trim() || sectionId;

            const data = REVISION_NOTES[currentPaper][currentSection];
            const section = data.sections.find(s => s.id === sectionId);

            if (section) {
                section.content = newContent;
                section.label = newLabel;

                const container = document.getElementById('note-content-' + sectionId);
                const titleEl = document.getElementById('note-label-' + sectionId);
                if (titleEl) titleEl.textContent = newLabel;
                if (container) {
                    container.innerHTML = renderNoteHtml(newContent);
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise([container]);
                    }
                }

                updateTOC();
                queueNoteUpdate(currentPaper, currentSection, sectionId, newContent, newLabel);
                teardownRevisionNoteEditor();
            }
        }

        function showConfirmDialog(message, opts) {
            opts = opts || {};
            const confirmText = opts.confirmText || 'Confirm';
            const cancelText = opts.cancelText || 'Cancel';
            const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            const escapedMsg = esc(message);
            const escapedCancel = esc(cancelText);
            const escapedConfirm = esc(confirmText);
            const checkSvg = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>';
            const crossSvg = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
            return new Promise(function(resolve) {
                const overlay = document.createElement('div');
                overlay.className = 'note-confirm-overlay';
                overlay.innerHTML = `
                    <div class="note-confirm-card">
                        <p class="note-confirm-message">${escapedMsg}</p>
                        <div class="note-confirm-actions">
                            <button type="button" class="note-confirm-btn note-confirm-btn-no" data-result="false" aria-label="${escapedCancel}">${crossSvg}</button>
                            <button type="button" class="note-confirm-btn note-confirm-btn-yes" data-result="true" aria-label="${escapedConfirm}">${checkSvg}</button>
                        </div>
                    </div>
                `;
                function close(result) {
                    overlay.remove();
                    resolve(result);
                }
                overlay.addEventListener('click', function(ev) {
                    if (ev.target === overlay) close(false);
                    const btn = ev.target.closest('.note-confirm-btn');
                    if (btn && btn.dataset.result !== undefined) close(btn.dataset.result === 'true');
                });
                document.body.appendChild(overlay);
            });
        }

        async function deleteNoteSection(sectionId) {
            const data = REVISION_NOTES[currentPaper][currentSection];
            const section = data && data.sections && data.sections.find(s => s.id === sectionId);
            const label = section ? section.label : sectionId;
            const confirmed = await showConfirmDialog(`Are you sure you want to delete "${label}"? This cannot be undone.`, { confirmText: 'Delete', cancelText: 'Cancel' });
            if (!confirmed) return;

            if (revisionFullEditor.type === 'section' && revisionFullEditor.sectionId === sectionId) {
                teardownRevisionNoteEditor();
            }

            const index = data.sections.findIndex(s => s.id === sectionId);
            
            if (index !== -1) {
                data.sections.splice(index, 1);
                
                // Queue deletion (content=null or delete flag)
                queueNoteUpdate(currentPaper, currentSection, sectionId, null, null, true);
                
                // Re-render the whole notes view to reflect removal from TOC and sections
                renderRevisionNotes();
            }
        }

        function updateTOC() {
            const data = REVISION_NOTES[currentPaper][currentSection];
            const tocLinks = document.getElementById('toc-links');
            if (!tocLinks || !data.sections) return;
            
            let html = '';
            data.sections.forEach(sec => {
                html += buildTocItem(sec.id, sec.label, true);
            });
            if (data.tips || isAdmin()) {
                html += buildTocItem('note-tips-container', 'Revision Tips', false);
            }
            tocLinks.innerHTML = html;
            
            // Re-attach listeners and data-section (scroll listener already set by initNotesSidebar)
            setupTocLinksOnly();
        }

        function setupTocLinksOnly() {
            const data = REVISION_NOTES[currentPaper] && REVISION_NOTES[currentPaper][currentSection];
            const tocLinks = document.getElementById('toc-links');
            if (!tocLinks || !data || !data.sections) return;
            tocLinks.querySelectorAll('.toc-item .toc-link').forEach(function(a) {
                const id = (a.getAttribute('href') || '').replace('#', '');
                if (id) a.dataset.section = id;
                a.addEventListener('click', function(ev) {
                    ev.preventDefault();
                    handleTocClick(ev, id);
                });
            });
            const initial = (location.hash && location.hash.slice(1)) || (data.sections[0] && data.sections[0].id);
            if (initial) setActiveToc(initial);
        }

        // Highlight the TOC item matching `id`
        function setActiveToc(id) {
            if (!id) return;
            document.querySelectorAll('.notes-sidebar .toc-link').forEach(function(a) {
                a.classList.toggle('active', a.dataset.section === id);
            });
        }

        // Simple throttle
        function throttle(fn, wait) {
            let last = 0;
            return function() {
                const now = Date.now();
                if (now - last >= wait) {
                    last = now;
                    fn.apply(this, arguments);
                }
            };
        }

        function showTipsEditor() {
            const data = REVISION_NOTES[currentPaper][currentSection];
            var tipsContainer = document.getElementById('note-tips-container');
            if (tipsContainer) tipsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });

            revisionFullEditor.type = 'tips';
            revisionFullEditor.sectionId = null;
            revisionFullEditor.originalContent = data.tips || '';
            revisionFullEditor.originalLabel = '';

            var bc = escapeRevisionEditorAttr(revisionEditorPaperLabel() + ' · ' + revisionEditorTopicTitle());
            var titleSlot = '<p class="revision-editor-static-title">Revision priorities &amp; tips</p>';
            var markup = buildRevisionEditorMarkup(bc, titleSlot, 'Save tips', { titleLabel: '' });
            openRevisionEditorOverlay(markup, function() {
                document.getElementById('revision-editor-source').value = data.tips || '';
            });
            document.getElementById('revision-editor-save').addEventListener('click', function() {
                saveTips();
            });
        }

        function saveTips() {
            if (revisionFullEditor.type !== 'tips') return;
            const textarea = document.getElementById('revision-editor-source');
            if (!textarea) return;
            const newTips = textarea.value;
            const data = REVISION_NOTES[currentPaper][currentSection];

            data.tips = newTips;
            const container = document.getElementById('note-tips-content');
            if (container) {
                container.innerHTML = renderNoteHtml(newTips);
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([container]);
                }
            }
            queueNoteUpdate(currentPaper, currentSection, 'TIPS_PROPERTY', newTips);
            teardownRevisionNoteEditor();
        }

        function queueNoteUpdate(paper, section, sectionId, content, label = null, isDelete = false) {
            const key = `${paper}|${section}|${sectionId}`;
            revisionNoteQueue = revisionNoteQueue.filter(item => item.key !== key);
            revisionNoteQueue.push({ paper, section, sectionId, content, label, delete: isDelete, key });

            showCorrectionToast(isDelete ? 'Section deletion queued' : 'Note edit queued — saving in 15s');
            if (revisionNoteTimer) clearTimeout(revisionNoteTimer);
            revisionNoteTimer = setTimeout(flushNoteUpdateQueue, REVISION_NOTE_DEBOUNCE_MS);
        }

        function flushNoteUpdateQueue() {
            if (revisionNoteTimer) { clearTimeout(revisionNoteTimer); revisionNoteTimer = null; }
            if (revisionNoteQueue.length === 0) return;

            const batch = revisionNoteQueue.map(item => ({
                paper: item.paper,
                section: item.section,
                sectionId: item.sectionId,
                content: item.content,
                label: item.label,
                delete: item.delete
            }));
            revisionNoteQueue = [];

            fetch('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ edits: batch })
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) {
                    showCorrectionToast(res.count === 1 ? 'Updated notes.js' : `${res.count} changes saved to notes.js`);
                } else {
                    showCorrectionToast('Note save failed: ' + (res.error || 'Unknown error'));
                }
            })
            .catch(err => {
                console.error('Note save error:', err);
                showCorrectionToast('Offline — changes not saved to server');
            });
        }

        window.addEventListener('beforeunload', function() {
            if (revisionNoteQueue.length > 0 && navigator.sendBeacon) {
                const blob = new Blob([JSON.stringify({ edits: revisionNoteQueue })], { type: 'application/json' });
                navigator.sendBeacon('/api/notes', blob);
            }
        });

    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script>
    window.questionBankChat = null;
    if (typeof isAdmin === 'function' && isAdmin()) {
      var _chatCss = document.createElement('link');
      _chatCss.rel = 'stylesheet';
      _chatCss.href = 'chat/chat.css';
      document.head.appendChild(_chatCss);
      var _chatBoot = document.createElement('script');
      _chatBoot.type = 'module';
      _chatBoot.src = 'chat/bootstrap.js';
      document.body.appendChild(_chatBoot);
    }
    </script>
</body>
