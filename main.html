<body>

    <div class="paper-container">
        <!-- Sticky Header -->
        <div class="sticky-header">
            <div class="mode-toggle-wrap">
                <button class="mode-btn active" id="mode-q" onclick="setAppMode('questions')">Questions</button>
                <button class="mode-btn" id="mode-n" onclick="setAppMode('notes')">Revision Notes</button>
            </div>
            <h1 id="paper-title">ISS Statistics Paper I</h1>
            <div class="set-indicator-wrap">
                <span class="set-indicator-line set-indicator-left"></span>
                <span class="set-indicator-text">Set <span class="set-dot">◆</span> <span id="set-letter">A</span></span>
                <span class="set-indicator-line set-indicator-right"></span>
            </div>
            <div class="meta-controls">
                <div class="meta-item meta-paper">
                    <span class="meta-label">Paper</span>
                    <span class="meta-value" id="paper-value">Paper I</span>
                    <select id="paper-select" onchange="setPaper(this.value)">
                        <option value="paper1">Paper I</option>
                        <option value="paper2">Paper II</option>
                    </select>
                </div>
                <div class="meta-sep-line"></div>
                <div class="meta-item meta-section">
                    <span class="meta-label">Section</span>
                    <span class="meta-value" id="section-value">Probability &amp; Statistics</span>
                    <select id="section-select" onchange="setSection(this.value)">
                        <option value="prob">Probability &amp; Statistics</option>
                        <option value="num">Numerical Analysis</option>

                <div class="meta-item meta-year">
                    <span class="meta-label">Year</span>
                    <span class="meta-value" id="year-value">2025</span>
                    <select id="year-select" onchange="loadYear(this.value)">
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                        <option value="2018">2018</option>
                        <option value="2017">2017</option>
                    </select>
                </div>
            </div>
            <div class="auth-row">
                <div class="auth-wrap" id="auth-wrap"></div>

        <!-- Content viewer -->

    <script src="notes.js"></script>
    <script src="answers.js"></script>
    <script src="explanations.js"></script>
    <script>
        // Admin role: only admin sees Wrong Answer? (sessionStorage.iss_admin)
        function isAdmin() { return sessionStorage.getItem('iss_admin') === '1'; }
        function getAdminName() { return sessionStorage.getItem('iss_admin_name') || 'Admin'; }
        function updateAuthLink() {
            var wrap = document.getElementById('auth-wrap');
            if (!wrap) return;
            var name = getAdminName();
            if (isAdmin()) {
                wrap.innerHTML = '<span class="auth-pill auth-pill-logged">' +
                    '<span class="auth-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>' +
                    '<span class="auth-text">Admin: <strong>' + (name || 'Admin') + '</strong></span>' +
                    '<button type="button" class="auth-logout-btn" aria-label="Logout"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></button>' +
                    '</span>';
                wrap.querySelector('.auth-logout-btn').addEventListener('click', function() {
                    sessionStorage.removeItem('iss_admin');
                    sessionStorage.removeItem('iss_admin_name');
                    window.location.reload();
                });
            } else {
                wrap.innerHTML = '<span class="auth-login-wrap">' +
                    '<a href="login.html" class="auth-pill auth-pill-login">' +
                    '<span class="auth-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></span>' +
                    '<span class="auth-text">Admin Login</span>' +
                    '</a>' +
                    ' <span class="auth-hint">(if you want to update answers)</span>' +
                    '</span>';
            }
        }
        updateAuthLink();

        // Track current selection
        var currentPaper = 'paper1'; // 'paper1' | 'paper2'
        var currentYear = '2025';
        var currentSection = 'prob'; // Paper 1: 'prob' | 'num' | 'comp'; Paper 2: 'linear' | 'inference' | 'official'
        var appMode = 'questions'; // 'questions' | 'notes'

        function setAppMode(mode) {
            appMode = mode;
            document.getElementById('mode-q').classList.toggle('active', mode === 'questions');
            document.getElementById('mode-n').classList.toggle('active', mode === 'notes');
            
            // Hide/Show year selector and set indicator based on mode
            var yearMeta = document.querySelector('.meta-year');
            var setIndicator = document.querySelector('.set-indicator-wrap');
            var lastSep = document.querySelector('.meta-sep-line:last-of-type');
            
            if (yearMeta) yearMeta.style.display = (mode === 'notes') ? 'none' : 'flex';
            if (setIndicator) setIndicator.style.display = (mode === 'notes') ? 'none' : 'flex';
            if (lastSep) lastSep.style.display = (mode === 'notes') ? 'none' : 'block';

            updateControlsUI();
            if (mode === 'questions') {
                loadContent(); // Loads the HTML files
            } else {
                renderRevisionNotes(); // Renders from notes.js
            }
        }

        function buildTocItem(id, label, isSection) {
            var copySvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
            var editSvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M3 17.25V21h4.25L17.81 9.94l-4.25-4.25L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 4.25 4.25 1.83-1.83z"/></svg>';
            var delSvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
            var actions = '<div class="toc-item-actions" onclick="event.stopPropagation()">' +
                '<button class="toc-action-btn toc-copy-btn" title="Copy" data-tooltip="Copy" onclick="copyNoteContent(\'' + id + '\', event)" aria-label="Copy">' + copySvg + '</button>';
            if (isAdmin()) {
                if (isSection) {
                    actions += '<button class="toc-action-btn toc-edit-btn" title="Edit" onclick="showNoteSectionEditor(\'' + id + '\')" aria-label="Edit">' + editSvg + '</button>';
                    actions += '<button class="toc-action-btn toc-delete-btn" title="Delete" onclick="deleteNoteSection(\'' + id + '\')" aria-label="Delete">' + delSvg + '</button>';
                } else {
                    actions += '<button class="toc-action-btn toc-edit-btn" title="Edit tips" onclick="showTipsEditor()" aria-label="Edit tips">' + editSvg + '</button>';
                }
            }
            actions += '</div>';
            return '<div class="toc-item" data-section="' + id + '">' +
                '<a href="#' + id + '" class="toc-link">' + label + '</a>' + actions + '</div>';
        }

        function renderRevisionNotes() {
            const viewer = document.getElementById('year-viewer');
            const paperData = REVISION_NOTES[currentPaper] || {};
            const data = paperData[currentSection] || { title: currentSection, sections: [], tips: "" };

            var sepHtml = `<div class="note-sep" style="display:flex;align-items:center;gap:2px;margin:28px 0;">
                    <span style="flex:1;height:3px;border-radius:6px;background:linear-gradient(90deg,transparent, rgba(124,58,237,0.95));opacity:0.9;box-shadow:0 2px 8px rgba(124,58,237,0.08)"></span>
                    <svg width="48" height="28" viewBox="0 0 48 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="flex:0 0 auto;">
                        <defs>
                            <linearGradient id="sepGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#c4b5fd"/>
                            <stop offset="1" stop-color="#7c3aed"/>
                            </linearGradient>
                        </defs>
                        <text x="10" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="url(#sepGrad)" style="font-family:system-ui, -apple-system, Segoe UI, sans-serif;">μ</text>
                        <text x="24" y="19" text-anchor="middle" font-size="16" font-weight="700" fill="url(#sepGrad)" style="font-family:system-ui, -apple-system, Segoe UI, sans-serif;">Σ</text>
                        <text x="38" y="18" text-anchor="middle" font-size="13" font-weight="600" fill="url(#sepGrad)" style="font-family:system-ui, -apple-system, Segoe UI, sans-serif;">∫</text>
                        <circle cx="16.5" cy="14" r="1.2" fill="url(#sepGrad)" opacity="0.7"/>
                        <circle cx="31.5" cy="14" r="1.2" fill="url(#sepGrad)" opacity="0.7"/>
                    </svg>
                    <span style="flex:1;height:3px;border-radius:6px;background:linear-gradient(90deg, rgba(124,58,237,0.95),transparent);opacity:0.9;box-shadow:0 2px 8px rgba(124,58,237,0.08)"></span>
                </div>`;

            // New Layout Structure: Sidebar + Main Content
            let html = `
                <div class="notes-layout" id="notes-layout">
                    <aside class="notes-sidebar" id="notes-sidebar">
                        <div class="sidebar-header">
                            <span class="topic-badge">KEY TOPICS</span>
                            <button class="sidebar-close-btn" onclick="toggleSidebar()" aria-label="Close Sidebar">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                            </button>
                        </div>
                        <div class="toc-links" id="toc-links">`;

            if (data.sections && data.sections.length > 0) {
                data.sections.forEach(sec => {
                    html += buildTocItem(sec.id, sec.label, true);
                });
                if (data.tips || isAdmin()) {
                    html += buildTocItem('note-tips-container', 'Revision Tips', false);
                }
            } else {
                html += `<p class="q-notes-empty" style="padding: 10px;">No topics yet.</p>`;
            }

            html += `   </div>
                        ${isAdmin() ? `<button class="sidebar-add-btn" onclick="showAddSectionForm()">+ Add Section</button>` : ''}
                    </aside>
                    
                    <button class="sidebar-open-btn" id="sidebar-open-btn" onclick="toggleSidebar()" aria-label="Open Sidebar">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                        <span>Topics</span>
                    </button>

                    <main class="notes-main-content">
                        <div class="notes-container">
                            <div class="notes-header">
                                <h1>${data.title}</h1>
                            </div>
                            ${sepHtml}`;

            if (!data.sections || data.sections.length === 0) {
                html += `
                    <div class="q-notes-empty">
                        <p>No notes available for this section yet.</p>
                        ${isAdmin() ? `<button class="note-add-btn" onclick="showAddSectionForm()">+ Add First Section</button>` : ''}
                    </div>
                `;
            } else {
                // Sections
                var copyIcon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
                var editIcon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 17.25V21h4.25L17.81 9.94l-4.25-4.25L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 4.25 4.25 1.83-1.83z"/></svg>';
                var delIcon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
                data.sections.forEach(sec => {
                    var headerActions = '<div class="note-section-actions"><button class="note-section-action-btn" title="Copy" onclick="copyNoteContent(\'' + sec.id + '\', event)" aria-label="Copy">' + copyIcon + '</button>';
                    if (isAdmin()) {
                        headerActions += '<button class="note-section-action-btn" title="Edit" onclick="showNoteSectionEditor(\'' + sec.id + '\')" aria-label="Edit">' + editIcon + '</button>';
                        headerActions += '<button class="note-section-action-btn note-section-delete-btn" title="Delete" onclick="deleteNoteSection(\'' + sec.id + '\')" aria-label="Delete">' + delIcon + '</button>';
                    }
                    headerActions += '</div>';
                    html += `<section id="${sec.id}" class="note-section">
                        <div class="note-section-header" style="display:flex; justify-content:space-between; align-items:center;">
                            <h2 class="section-title" id="note-label-${sec.id}">${sec.label}</h2>
                            ${headerActions}
                        </div>
                        <div class="note-section-content" id="note-content-${sec.id}">${renderNoteHtml(sec.content)}</div>
                    </section>`;
                    html += sepHtml;
                });

                // Final Tip Callout
                if (data.tips || isAdmin()) {
                    html += `<div class="note-callout tip" id="note-tips-container" style="width:100%; box-sizing:border-box;">
                        <div class="callout-icon">💡</div>
                        <div class="callout-content" style="width:100%;">
                            <div class="note-section-header" style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:8px;">
                                <span class="tip-label">Revision Priorities & Tips</span>
                                <div class="note-section-actions">
                                    <button class="note-section-action-btn" title="Copy" onclick="copyNoteContent('note-tips-container', event)" aria-label="Copy">${copyIcon}</button>
                                    ${isAdmin() ? '<button class="note-section-action-btn" title="Edit" onclick="showTipsEditor()" aria-label="Edit">' + editIcon + '</button>' : ''}
                                </div>
                            </div>
                            <div id="note-tips-content" style="width:100%;">${data.tips ? renderNoteHtml(data.tips) : '<div class="q-notes-empty">No tips available yet</div>'}</div>
                        </div>
                    </div>`;
                }
            }

            html += `</div></main></div>`;
            viewer.innerHTML = html;

            // Initialize sidebar state from localStorage
            if (localStorage.getItem('iss_sidebar_collapsed') === 'true') {
                document.getElementById('notes-layout').classList.add('sidebar-collapsed');
            }

            // Setup TOC highlighting and outside-click-to-close
            if (data.sections && data.sections.length > 0) {
                initNotesSidebar();
            }

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([viewer]);
            }
        }

        function initNotesSidebar() {
            const layout = document.getElementById('notes-layout');
            const sidebar = document.getElementById('notes-sidebar');
            const tocLinks = document.getElementById('toc-links');
            const mainContent = layout && layout.querySelector('.notes-main-content');
            if (!layout || !sidebar || !tocLinks || !mainContent) return;

            const data = REVISION_NOTES[currentPaper] && REVISION_NOTES[currentPaper][currentSection];
            if (!data || !data.sections) return;

            // Set data-section on each TOC link and attach click handler
            tocLinks.querySelectorAll('.toc-item .toc-link').forEach(function(a) {
                const id = (a.getAttribute('href') || '').replace('#', '');
                if (id) a.dataset.section = id;
                a.addEventListener('click', function(ev) {
                    ev.preventDefault();
                    handleTocClick(ev, id);
                });
            });

            // Set initial active item (first section or from hash)
            const initial = (location.hash && location.hash.slice(1)) || (data.sections[0] && data.sections[0].id);
            if (initial) setActiveToc(initial);

            // Scroll-based active section: listen to both year-viewer and window (desktop may scroll body)
            const scrollRoot = document.getElementById('year-viewer');
            var sections = Array.from(document.querySelectorAll('.note-section'));
            var tipsEl = document.getElementById('note-tips-container');
            if (tipsEl) sections.push(tipsEl);
            if (sections.length) {
                function updateActiveFromScroll() {
                    var refTop = 120;
                    var best = null;
                    var bestTop = -Infinity;
                    sections.forEach(function(s) {
                        var top = s.getBoundingClientRect().top;
                        if (top <= refTop + 60) {
                            if (top > bestTop) { best = s; bestTop = top; }
                        }
                    });
                    if (!best && sections[0]) best = sections[0];
                    if (best && best.id) {
                        setActiveToc(best.id);
                        try { history.replaceState(null, '', '#' + best.id); } catch (e) {}
                    }
                }
                var onScroll = throttle(updateActiveFromScroll, 80);
                if (scrollRoot) scrollRoot.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('scroll', onScroll, { passive: true });
                updateActiveFromScroll();
            }

            // Outside click: close sidebar when clicking outside it
            function closeSidebarIfOpen(ev) {
                if (!layout.parentNode) return;
                if (layout.classList.contains('sidebar-collapsed')) return;
                if (sidebar.contains(ev.target)) return;
                if (ev.target.closest && ev.target.closest('.sidebar-open-btn')) return;
                layout.classList.add('sidebar-collapsed');
                localStorage.setItem('iss_sidebar_collapsed', 'true');
            }
            document.addEventListener('click', closeSidebarIfOpen);
        }

        function toggleSidebar() {
            const layout = document.getElementById('notes-layout');
            if (!layout) return;
            const isCollapsed = layout.classList.toggle('sidebar-collapsed');
            localStorage.setItem('iss_sidebar_collapsed', isCollapsed);
        }

        function copyNoteContent(id, ev) {
            var data = REVISION_NOTES[currentPaper] && REVISION_NOTES[currentPaper][currentSection];
            if (!data) return;
            var text = '';
            if (id === 'note-tips-container') {
                text = data.tips || '';
            } else {
                var sec = data.sections && data.sections.find(function(s) { return s.id === id; });
                text = sec ? sec.content : '';
            }
            if (!text) return;
            var btn = ev && ev.target && ev.target.closest ? ev.target.closest('button') : null;
            function onSuccess() {
                if (btn) showCopySuccess(btn);
                else showCorrectionToast('Copied to clipboard');
            }
            function onFail() {
                showCorrectionToast('Copy failed');
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(onFail);
            } else {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    onSuccess();
                } catch (e) { onFail(); }
                document.body.removeChild(ta);
            }
        }

        // ─── Pre-MathJax capture ──────────────────────────────────────────────
        // This MUST run before MathJax touches the DOM.
        // At that point \( ... \) / \[ ... \] are still raw text nodes, so
        // textContent gives us proper LaTeX source rather than garbled SVG text.
        function formatTableForCopy(tableEl) {
            if (!tableEl || !tableEl.querySelectorAll) return '';
            var rows = [];
            tableEl.querySelectorAll('tr').forEach(function(tr) {
                var cells = [];
                tr.querySelectorAll('td, th').forEach(function(cell) {
                    cells.push(cell.textContent.trim());
                });
                if (cells.length) rows.push(cells.join('\t'));
            });
            return rows.join('\n');
        }
        function extractTextWithTables(el) {
            var parts = [];
            function walk(node) {
                if (!node) return;
                if (node.nodeType === 3) {
                    parts.push(node.textContent);
                    return;
                }
                if (node.nodeType === 1) {
                    if (node.classList && node.classList.contains('q-table')) {
                        var table = node.querySelector('table');
                        if (table) parts.push(formatTableForCopy(table));
                        return;
                    }
                    if (node.tagName === 'BR') {
                        parts.push('\n');
                        return;
                    }
                    for (var i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
                }
            }
            walk(el);
            return parts.join('').trim();
        }
        function captureCardCopyText(container) {
            var cards = container.querySelectorAll('.question-card');
            cards.forEach(function(card) {
                var qNumberEl = card.querySelector('.q-number');
                var qNumber = qNumberEl ? qNumberEl.textContent.trim() : '';
                var qTopicEl = card.querySelector('.q-topic');
                var qTopic = qTopicEl ? qTopicEl.textContent.trim() : '';
                var qText = '';
                Array.prototype.forEach.call(card.children, function(child) {
                    if (child.classList && child.classList.contains('q-text')) {
                        var t = extractTextWithTables(child);
                        if (t) qText += t + '\n';
                    } else if (child.classList && child.classList.contains('q-table')) {
                        var t = formatTableForCopy(child.querySelector('table'));
                        if (t) qText += t + '\n';
                    }
                });
                qText = qText.trim();
                var qContextEl = card.querySelector('.q-context');
                var qContext = qContextEl ? extractTextWithTables(qContextEl) + '\n\n' : '';
                var options = [];
                card.querySelectorAll('.option-item').forEach(function(item) {
                    var t = item.textContent.trim();
                    if (t) options.push(t);
                });
                var out = '';
                if (qContext) out += qContext;
                if (qNumber)  out += qNumber + ' ';
                if (qTopic)   out += qTopic + '\n';
                if (qText)    out += qText + '\n\n';
                if (options.length) {
                    out += 'Options:\n';
                    options.forEach(function(o) { out += o + '\n'; });
                }
                card._latexCopyText = out.trim();
            });
        }

        // Wrap option content nodes into a dedicated container (.opt-content)
        // so we can apply width and wrapping rules consistently.
        function wrapOptionContent(container) {
            var optionItems = container.querySelectorAll('.option-item');
            optionItems.forEach(function(item) {
                // Skip if already wrapped
                if (item.querySelector('.opt-content')) return;

                var label = item.querySelector('.opt-label');
                var wrapper = document.createElement('div');
                wrapper.className = 'opt-content';

                // Move all nodes except the label into wrapper
                var child = item.firstChild;
                while (child) {
                    var next = child.nextSibling;
                    if (label && child === label) {
                        // keep label in place
                    } else {
                        try { wrapper.appendChild(child); } catch (e) {}
                    }
                    child = next;
                }

                // Append wrapper to the item (after label)
                item.appendChild(wrapper);
            });
        }

        // Copy button functionality - DRY principle
        function addCopyButtons(container) {
            var questionCards = container.querySelectorAll('.question-card');
            questionCards.forEach(function(card) {

                copyBtn.setAttribute('aria-label', 'Copy question');

        function copyQuestionText(card, button) {
            try {
                // Prefer the pre-MathJax captured text which preserves LaTeX source
                // (\( ... \) / \[ ... \] notation intact — readable by AI tools).
                // Falls back to live DOM extraction if capture was not run.
                var formattedText = card._latexCopyText || '';

                if (!formattedText) {
                    // ── Fallback: extract from post-MathJax DOM (no LaTeX, plain text) ──
                    var qNumberEl = card.querySelector('.q-number');
                    var qNumber = qNumberEl ? qNumberEl.textContent.trim() : '';
                    var qTopicEl = card.querySelector('.q-topic');
                    var qTopic = qTopicEl ? qTopicEl.textContent.trim() : '';
                    var qText = '';
                    Array.prototype.forEach.call(card.children, function(child) {
                        if (child.classList && child.classList.contains('q-text')) {
                            var text = extractTextWithTables(child);
                            if (text) qText += text + '\n';
                        } else if (child.classList && child.classList.contains('q-table')) {
                            var t = formatTableForCopy(child.querySelector('table'));
                            if (t) qText += t + '\n';
                        }
                    });
                    qText = qText.trim();
                    var qContextEl = card.querySelector('.q-context');
                    var qContext = qContextEl ? extractTextWithTables(qContextEl) + '\n\n' : '';
                    var options = [];
                    card.querySelectorAll('.option-item').forEach(function(item) {
                        var optText = item.textContent.trim();
                        if (optText) options.push(optText);
                    });
                    if (qContext) formattedText += qContext;
                    if (qNumber)  formattedText += qNumber + ' ';
                    if (qTopic)   formattedText += qTopic + '\n';
                    if (qText)    formattedText += qText + '\n\n';
                    if (options.length) {
                        formattedText += 'Options:\n';
                        options.forEach(function(opt) { formattedText += opt + '\n'; });
                    }
                    formattedText = formattedText.trim();
                }

                // Copy to clipboard
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(formattedText).then(function() {
                        showCopySuccess(button);
                    }).catch(function(err) {
                        console.error('Failed to copy:', err);
                        fallbackCopy(formattedText, button);
                    });
                } else {
                    fallbackCopy(formattedText, button);
                }
            } catch (error) {
                console.error('Error copying question:', error);
            }
        }

        function showCopySuccess(button) {
            var originalHTML = button.innerHTML;
            button.classList.add('copied');
            // Same circular checkmark icon as show answer button, but green
            button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#7c3aed" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>';
            button.setAttribute('data-tooltip', 'Copied!');
            setTimeout(function() {
                button.classList.remove('copied');

                button.setAttribute('data-tooltip', 'Copy');

        }

        function fallbackCopy(text, button) {
            // Fallback for older browsers
            var textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';

            textArea.select();
            try {
                document.execCommand('copy');

            } catch (err) {
                console.error('Fallback copy failed:', err);
            }
            document.body.removeChild(textArea);
        }

        // Load content using fetch (works on both desktop and mobile)
        function loadContent() {
            if (appMode === 'notes') return;
            var viewer = document.getElementById('year-viewer');
            var filename = buildFilename();
            
            // Show loading state
            viewer.innerHTML = [
                '<div class="qb-loader">',
                '  <div class="qb-loader-ring-wrap">',
                '    <div class="qb-loader-ring-bg"></div>',
                '    <div class="qb-loader-ring-mid"></div>',
                '    <div class="qb-loader-ring"></div>',
                '    <div class="qb-loader-symbol">&#x3A3;</div>',
                '  </div>',
                '  <div class="qb-loader-dots">',
                '    <div class="qb-loader-dot"></div>',
                '    <div class="qb-loader-dot"></div>',
                '    <div class="qb-loader-dot"></div>',
                '  </div>',
                '  <div class="qb-loader-label">Loading questions</div>',
                '</div>'
            ].join('');
            
            // Function to process loaded HTML
            function processHTML(html) {
                // Extract body content from the HTML
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');
                var bodyContent = doc.body.innerHTML;
                
                // Inject content into viewer
                viewer.innerHTML = bodyContent;

                // Normalize option markup first, then capture LaTeX source
                wrapOptionContent(viewer);
                // Capture LaTeX source text BEFORE MathJax replaces text nodes
                captureCardCopyText(viewer);
                
                // Initialize MathJax FIRST, then add buttons AFTER MathJax is done
                function initMathJaxInViewer() {
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        var mathJaxReady = Promise.resolve();
                        if (window.MathJax.startup && window.MathJax.startup.promise) {
                            mathJaxReady = window.MathJax.startup.promise;
                        }
                        
                        mathJaxReady.then(function() {
                            if (window.MathJax.typesetClear) {
                                try {
                                    window.MathJax.typesetClear([viewer]);
                                } catch (e) {
                                    var mathElements = viewer.querySelectorAll('.MathJax, [id^="MathJax"]');
                                    mathElements.forEach(function(el) {
                                        try { el.remove(); } catch (e2) {}
                                    });
                                }
                            } else {
                                var mathElements = viewer.querySelectorAll('.MathJax, [id^="MathJax"]');
                                mathElements.forEach(function(el) {
                                    try { el.remove(); } catch (e) {}
                                });
                            }
                            
                            return window.MathJax.typesetPromise([viewer]);
                        }).then(function() {
                            addCopyButtons(viewer);
                            addShowAnswerButtons(viewer);
                        }).catch(function(err) {
                            console.error('MathJax error:', err);
                            addCopyButtons(viewer);
                            addShowAnswerButtons(viewer);
                        });
                    } else {
                        setTimeout(initMathJaxInViewer, 100);
                    }
                }
                
                setTimeout(initMathJaxInViewer, 200);
            }
            
            // Function to show error
            function showError(error) {
                console.error('Error loading file:', error);
                var isFileProtocol = window.location.protocol === 'file:';
                var errorMessage = isFileProtocol 
                    ? '<div style="text-align:center; padding:40px; color:#d32f2f; max-width:600px; margin:0 auto;">' +
                      '<p style="font-size:1.2em; font-weight:bold; margin-bottom:15px;">⚠️ Cannot Load Questions</p>' +
                      '<p style="font-size:0.95em; margin-bottom:15px; color:#333;">' +
                      'To load local files, use a local web server instead of opening directly.</p>' +
                      '<p style="font-size:0.9em; margin-top:20px; padding:15px; background:#e3f2fd; border-radius:8px; color:#1976d2;">' +
                      '<strong>✅ Solution: Use a Local Web Server</strong><br><br>' +
                      '1. Open terminal in this folder<br>' +
                      '2. Run: <code>python3 -m http.server 8000</code><br>' +
                      '3. Go to: <code>http://localhost:8000/main.html</code><br><br>' +
                      'Or double-click <code>start-server.sh</code> for easy setup!' +
                      '</p>' +
                      '<p style="font-size:0.85em; margin-top:15px; color:#666;">' +
                      'File attempted: ' + filename + '</p>' +
                      '</div>'
                    : '<div style="text-align:center; padding:40px; color:#d32f2f;">' +
                      '<p><strong>Error loading questions</strong></p>' +
                      '<p style="font-size:0.9em; margin-top:10px;">File: ' + filename + '</p>' +
                      '<p style="font-size:0.85em; margin-top:10px; color:#666;">' +
                      'Make sure all HTML files are in the same folder.</p>' +
                      '</div>';
                viewer.innerHTML = errorMessage;
            }
            
            // Try fetch first, fallback to XHR
            if (typeof fetch !== 'undefined') {
                var cacheBuster = '?t=' + new Date().getTime();
                fetch(filename + cacheBuster, {
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
                })
                    .then(function(response) {
                        if (!response.ok) throw new Error('File not found: ' + filename);
                        return response.text();
                    })
                    .then(processHTML)
                    .catch(function() { tryXHR(); });
            } else {
                tryXHR();
            }
            
            function tryXHR() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', filename, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 0 || xhr.status === 200) {
                            processHTML(xhr.responseText);
                        } else {
                            showError('HTTP ' + xhr.status);
                        }
                    }
                };
                xhr.onerror = function() { showError('Network error'); };
                try { xhr.send(); } catch (e) { showError(e.message); }
            }
        }

    <!-- Show Answer Functionality -->
    <script>
        // Map section keys to answer file keys
        var sectionToAnswerKey = {
            'prob': 'prob',
            'num': 'num',
            'comp': 'comp',
            'linear': 'linear',
            'inference': 'inference',
            'official': 'official'
        };

        // Add show answer buttons and functionality to a container
        function addShowAnswerButtons(container) {
            if (!container) return;
            
            // Get current answers for this paper/section/year
            var answers = QUESTION_ANSWERS[currentPaper];
            if (!answers) return;
            
            var sectionKey = sectionToAnswerKey[currentSection];
            var sectionAnswers = answers[sectionKey];
            if (!sectionAnswers) return;
            
            var yearAnswers = sectionAnswers[currentYear];
            if (!yearAnswers) return;
            
            // Get all question cards
            var questionCards = container.querySelectorAll('.question-card');
            
            questionCards.forEach(function(card) {
                // Skip if button already exists
                if (card.querySelector('.q-answer-btn')) {
                    return;
                }
                
                // Get question number
                var qNumberEl = card.querySelector('.q-number');
                if (!qNumberEl) return;
                
                var qNumber = qNumberEl.textContent.trim().replace('.', '');
                var correctAnswer = getEffectiveAnswer(currentPaper, sectionKey, currentYear, qNumber) || yearAnswers[qNumber];
                
                // Only add button if we have an answer for this question
                if (!correctAnswer) return;
                
                // Create show answer button (eye icon - shown by default)
                var answerBtn = document.createElement('button');
                answerBtn.className = 'q-answer-btn';
                answerBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
                answerBtn.setAttribute('aria-label', 'Show answer for question ' + qNumber);
                answerBtn.setAttribute('data-tooltip', 'Show Answer');
                
                // Add click handler
                answerBtn.addEventListener('click', function() {
                    var effective = getEffectiveAnswer(currentPaper, sectionKey, currentYear, qNumber);
                    toggleAnswer(card, answerBtn, effective || correctAnswer, qNumber);
                });
                
                // Insert into actions row (before copy button)
                var right = card.querySelector('.q-actions-right');
                if (right) {
                    right.insertBefore(answerBtn, right.firstChild);
                } else {
                    card.appendChild(answerBtn);

        // Get effective answer (QUESTION_ANSWERS + localStorage corrections)
        function getEffectiveAnswer(paper, section, year, qNumber) {
            try {
                var corrections = JSON.parse(localStorage.getItem('iss_answer_corrections') || '{}');
                var p = corrections[paper];
                if (p && p[section] && p[section][year] && p[section][year][qNumber]) {
                    return p[section][year][qNumber];
                }
            } catch (e) {}
            var answers = QUESTION_ANSWERS[paper];
            if (!answers) return null;
            var sectionAnswers = answers[sectionToAnswerKey[section]];
            if (!sectionAnswers) return null;
            var yearAnswers = sectionAnswers[year];
            if (!yearAnswers) return null;
            return yearAnswers[qNumber] || null;
        }

        // Toggle answer visibility
        function toggleAnswer(card, button, correctAnswer, qNumber) {
            var isShowing = button.classList.contains('showing');
            var optLabel = (correctAnswer || '').toLowerCase();
            var options = card.querySelectorAll('.option-item');
            
            if (!isShowing) {
                // Show answer - highlight the correct option

    <script>

        function showNotesView(card, qNumber, notesWrap) {
            var noteText = getEffectiveExplanation(currentPaper, sectionToExplanationsKey[currentSection], currentYear, qNumber) || '';
            notesWrap.innerHTML = '<div class="q-notes-content">' + renderNoteHtml(noteText) + '</div>';
            var trigger = card.querySelector('.revealed-triggers-row .edit-explanation-trigger');

            }

        function renderNoteHtml(text) {
            if (!text) return '<div class="q-notes-empty">No content available</div>';
            
            // 1. Protect MathJax LaTeX snippets (\[...\], \(...\), $$...$$, $...$)
            var placeholders = [];
            var s = text
                .replace(/\$\$[\s\S]*?\$\$/g, function(m) { var id = '%%LATEX_' + placeholders.length + '%%'; placeholders.push(m); return id; })
                .replace(/\\\[[\s\S]*?\\\]/g, function(m) { var id = '%%LATEX_' + placeholders.length + '%%'; placeholders.push(m); return id; })
                .replace(/\\\([\s\S]*?\\\)/g, function(m) { var id = '%%LATEX_' + placeholders.length + '%%'; placeholders.push(m); return id; })
                .replace(/\$[^$\n]+?\$/g, function(m) { var id = '%%LATEX_' + placeholders.length + '%%'; placeholders.push(m); return id; });

            // 2. Simple Markdown parsing
            var lines = s.split('\n');
            var resultHtml = '';
            var listStack = [];
            var inTable = false;
            var tableRows = [];

            function closeLists(toLevel) {
                while (listStack.length > toLevel) {
                    var type = listStack.pop();
                    resultHtml += (type === 'ul' ? '</ul>' : '</ol>');
                }
            }

            function renderTable() {
                if (tableRows.length > 0) {
                    resultHtml += '<div class="q-table"><table>';
                    tableRows.forEach((row, idx) => {
                        resultHtml += '<tr>';
                        row.forEach(cell => {
                            var tag = (idx === 0) ? 'th' : 'td';
                            resultHtml += `<${tag}>${parseInline(cell)}</${tag}>`;
                        });
                        resultHtml += '</tr>';
                    });
                    resultHtml += '</table></div>';
                    tableRows = [];
                }
                inTable = false;
            }

            function parseInline(txt) {
                if (!txt) return '';
                var t = txt.replace(/&/g, '&amp;')
                           .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                           .replace(/__(.*?)__/g, '<strong>$1</strong>')
                           .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                           .replace(/`(.*?)`/g, '<code>$1</code>');
                return t;
            }

            var inCodeBlock = false;
            var codeBlockLines = [];

            for (var i = 0; i < lines.length; i++) {
                var rawLine = lines[i];
                var line = rawLine.trim();
                
                // Handle Fenced Code Block (```)
                if (/^```(\w*)\s*$/.test(line)) {
                    if (inCodeBlock) {
                        closeLists(0);
                        var codeContent = codeBlockLines.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        resultHtml += '<pre class="note-code-block"><code>' + codeContent + '</code></pre>';
                        inCodeBlock = false;
                        codeBlockLines = [];
                    } else {
                        closeLists(0);
                        inCodeBlock = true;
                    }
                    continue;
                }
                if (inCodeBlock) {
                    codeBlockLines.push(rawLine);
                    continue;
                }

                // Handle Tables
                if (line.startsWith('|') && line.endsWith('|')) {
                    closeLists(0);
                    if (line.indexOf('---') === -1) {
                        var cells = line.split('|').slice(1, -1);
                        tableRows.push(cells.map(c => c.trim()));
                    }
                    inTable = true;
                    continue;
                } else if (inTable) {
                    renderTable();
                }

                if (!line) {
                    closeLists(0);
                    continue;
                }

                // Handle Horizontal Rule (---, ***, ___)
                if (/^(---|\*\*\*|___)\s*$/.test(line)) {
                    closeLists(0);
                    resultHtml += '<hr class="note-hr">';
                    continue;
                }

                // Handle Headers (# through ######) — check most # first
                var hMatch = line.match(/^(#{1,6})\s+(.*)$/);
                if (hMatch) {
                    closeLists(0);
                    var level = Math.min(hMatch[1].length, 6);
                    var hClass = 'note-h' + level;
                    resultHtml += `<h${level} class="${hClass}">${parseInline(hMatch[2].trim())}</h${level}>`;
                    continue;
                }

                // Handle Blockquote
                if (line.startsWith('>')) {
                    closeLists(0);
                    var bqContent = line.replace(/^>\s?/, '');
                    var bqClass = 'note-blockquote';
                    if (bqContent.includes('ISS tip:')) {
                        bqClass += ' tip-style';
                    }
                    resultHtml += `<blockquote class="${bqClass}">${parseInline(bqContent)}</blockquote>`;
                    continue;
                }

                // Handle Lists (including nested)
                var indentMatch = rawLine.match(/^(\s*)/);
                var indent = indentMatch ? indentMatch[1].length : 0;
                var level = Math.floor(indent / 2); // 2 spaces per level
                
                var listMatch = line.match(/^([-*]|\d+\.)\s+(.*)/);
                if (listMatch) {
                    var marker = listMatch[1];
                    var content = listMatch[2];
                    var type = (marker === '-' || marker === '*') ? 'ul' : 'ol';

                    if (listStack.length < level + 1) {
                        while (listStack.length < level + 1) {
                            var currentType = (listStack.length === level) ? type : 'ul';
                            var listClass = currentType === 'ul' ? 'note-list' : 'note-list note-ol';
                            resultHtml += `<${currentType} class="${listClass}">`;
                            listStack.push(currentType);
                        }
                    } else if (listStack.length > level + 1) {
                        closeLists(level + 1);
                    }

                    // Check if type changed at the same level
                    if (listStack.length > 0 && listStack[listStack.length - 1] !== type) {
                        resultHtml += (listStack.pop() === 'ul' ? '</ul>' : '</ol>');
                        var listClass = type === 'ul' ? 'note-list' : 'note-list note-ol';
                        resultHtml += `<${type} class="${listClass}">`;
                        listStack.push(type);
                    }

                    resultHtml += `<li>${parseInline(content)}</li>`;
                } else {
                    closeLists(0);
                    resultHtml += `<p class="note-p">${parseInline(line)}</p>`;
                }
            }
            
            closeLists(0);
            if (inTable) renderTable();
            if (inCodeBlock && codeBlockLines.length > 0) {
                var codeContent = codeBlockLines.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                resultHtml += '<pre class="note-code-block"><code>' + codeContent + '</code></pre>';
            }

            // 3. Restore MathJax LaTeX snippets
            for (var i = 0; i < placeholders.length; i++) {
                resultHtml = resultHtml.replace('%%LATEX_' + i + '%%', placeholders[i]);
            }

            return resultHtml;
        }

                    <div class="note-editor-actions">
                        <button class="note-cancel-btn" onclick="this.closest('.note-modal-overlay').remove()">Cancel</button>
                        <button class="note-save-btn" onclick="createNewSection()">Create Section</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            const labelInput = document.getElementById('new-section-label');
            const idInput = document.getElementById('new-section-id');
            
            labelInput.addEventListener('input', () => {
                if (!idInput._manuallyEdited) {
                    idInput.value = labelInput.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
                }
            });
            idInput.addEventListener('input', () => { idInput._manuallyEdited = true; });
            labelInput.focus();
        }

        function createNewSection() {
            const label = document.getElementById('new-section-label').value.trim();
            const id = document.getElementById('new-section-id').value.trim();
            
            if (!label || !id) {
                alert('Both Label and ID are required.');
                return;
            }

            if (!REVISION_NOTES[currentPaper]) REVISION_NOTES[currentPaper] = {};
            if (!REVISION_NOTES[currentPaper][currentSection]) {
                REVISION_NOTES[currentPaper][currentSection] = {
                    title: currentSection.charAt(0).toUpperCase() + currentSection.slice(1),
                    sections: [],
                    tips: ""
                };
            }
            
            const data = REVISION_NOTES[currentPaper][currentSection];
            if (data.sections.find(s => s.id === id)) {
                alert('A section with this ID already exists.');
                return;
            }

            const newSec = { id, label, content: "New section content..." };
            data.sections.push(newSec);
            
            // Remove modal
            document.querySelector('.note-modal-overlay').remove();
            
            // Re-render and open editor
            renderRevisionNotes();
            showNoteSectionEditor(id);
            
            // Queue empty update to server to create the entry
            queueNoteUpdate(currentPaper, currentSection, id, newSec.content, label);
        }

        function showNoteSectionEditor(sectionId) {
            const data = REVISION_NOTES[currentPaper][currentSection];
            const section = data.sections.find(s => s.id === sectionId);
            if (!section) return;

            var target = document.getElementById(sectionId);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });

            const container = document.getElementById(`note-content-${sectionId}`);
            const titleEl = document.getElementById(`note-label-${sectionId}`);
            
            // Save current state for cancel functionality
            const currentContent = section.content;
            const currentLabel = section.label;

            // Make title editable - Full width container for title + buttons
            titleEl.parentNode.style.flexDirection = 'column';
            titleEl.parentNode.style.alignItems = 'flex-start';
            titleEl.parentNode.style.gap = '12px';
            
            titleEl.innerHTML = `<input type="text" id="edit-label-${sectionId}" value="${currentLabel.replace(/"/g, '&quot;')}" style="font-size: 1.2rem; font-weight: bold; background: rgba(0,0,0,0.3); border: 1px solid rgba(167, 139, 250, 0.3); color: white; width: 100%; border-radius: 8px; padding: 10px 15px; outline: none; box-sizing: border-box;">`;

            const headerRow = titleEl.parentNode;
            const headerActions = headerRow.querySelector('.note-section-actions');
            if (headerActions) headerActions.style.display = 'none';

            container.innerHTML = `
                <div class="note-editor-wrap">
                    ${NOTE_FORMAT_HINT}
                    <textarea class="note-editor-textarea" id="edit-area-${sectionId}"></textarea>
                    <div class="note-editor-actions">
                        <button class="note-cancel-btn" id="cancel-${sectionId}">Cancel</button>
                        <button class="note-save-btn" onclick="saveNoteSection('${sectionId}')">Save Changes</button>
                    </div>
                </div>
            `;
            
            const textarea = container.querySelector('textarea');
            textarea.value = currentContent;
            
            container.querySelector(`#cancel-${sectionId}`).onclick = () => {
                if (headerActions) headerActions.style.display = 'flex';
                cancelNoteEdit(sectionId, currentContent, currentLabel);
            };
            
            textarea.focus();
        }

        function restoreNoteSectionHeader(headerRow) {
            if (!headerRow) return;
            headerRow.style.flexDirection = '';
            headerRow.style.alignItems = 'center';
            headerRow.style.gap = '';
        }

        function cancelNoteEdit(sectionId, originalContent, originalLabel) {
            const container = document.getElementById(`note-content-${sectionId}`);
            const titleEl = document.getElementById(`note-label-${sectionId}`);
            if (titleEl) {
                titleEl.textContent = originalLabel;
                const headerRow = titleEl.parentNode;
                restoreNoteSectionHeader(headerRow);
                const headerActions = headerRow && headerRow.querySelector('.note-section-actions');
                if (headerActions) headerActions.style.display = 'flex';
            }
            
            if (container) {
                container.innerHTML = renderNoteHtml(originalContent);
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([container]);
                }
            }
        }

        function saveNoteSection(sectionId) {
            const textarea = document.getElementById(`edit-area-${sectionId}`);
            const labelInput = document.getElementById(`edit-label-${sectionId}`);
            if (!textarea || !labelInput) return;
            
            const newContent = textarea.value;
            const newLabel = labelInput.value.trim() || sectionId;
            
            const data = REVISION_NOTES[currentPaper][currentSection];
            const section = data.sections.find(s => s.id === sectionId);
            
            if (section) {
                section.content = newContent;
                section.label = newLabel;
                
                // Update UI
                const container = document.getElementById(`note-content-${sectionId}`);
                const titleEl = document.getElementById(`note-label-${sectionId}`);
                const headerRow = titleEl && titleEl.parentNode;
                restoreNoteSectionHeader(headerRow);
                const headerActions = headerRow && headerRow.querySelector('.note-section-actions');
                if (headerActions) headerActions.style.display = 'flex';
                if (titleEl) titleEl.textContent = newLabel;
                container.innerHTML = renderNoteHtml(newContent);
                
                // Refresh TOC if label changed
                updateTOC();

                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([container]);
                }
                
                queueNoteUpdate(currentPaper, currentSection, sectionId, newContent, newLabel);
            }
        }

        function showConfirmDialog(message, opts) {
            opts = opts || {};
            const confirmText = opts.confirmText || 'Confirm';
            const cancelText = opts.cancelText || 'Cancel';
            const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            const escapedMsg = esc(message);
            const escapedCancel = esc(cancelText);
            const escapedConfirm = esc(confirmText);
            const checkSvg = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>';
            const crossSvg = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
            return new Promise(function(resolve) {
                const overlay = document.createElement('div');
                overlay.className = 'note-confirm-overlay';
                overlay.innerHTML = `
                    <div class="note-confirm-card">
                        <p class="note-confirm-message">${escapedMsg}</p>
                        <div class="note-confirm-actions">
                            <button type="button" class="note-confirm-btn note-confirm-btn-no" data-result="false" aria-label="${escapedCancel}">${crossSvg}</button>
                            <button type="button" class="note-confirm-btn note-confirm-btn-yes" data-result="true" aria-label="${escapedConfirm}">${checkSvg}</button>
                        </div>
                    </div>
                `;
                function close(result) {
                    overlay.remove();
                    resolve(result);
                }
                overlay.addEventListener('click', function(ev) {
                    if (ev.target === overlay) close(false);
                    const btn = ev.target.closest('.note-confirm-btn');
                    if (btn && btn.dataset.result !== undefined) close(btn.dataset.result === 'true');
                });
                document.body.appendChild(overlay);
            });
        }

        async function deleteNoteSection(sectionId) {
            const data = REVISION_NOTES[currentPaper][currentSection];
            const section = data && data.sections && data.sections.find(s => s.id === sectionId);
            const label = section ? section.label : sectionId;
            const confirmed = await showConfirmDialog(`Are you sure you want to delete "${label}"? This cannot be undone.`, { confirmText: 'Delete', cancelText: 'Cancel' });
            if (!confirmed) return;
            
            const index = data.sections.findIndex(s => s.id === sectionId);
            
            if (index !== -1) {
                data.sections.splice(index, 1);
                
                // Queue deletion (content=null or delete flag)
                queueNoteUpdate(currentPaper, currentSection, sectionId, null, null, true);
                
                // Re-render the whole notes view to reflect removal from TOC and sections
                renderRevisionNotes();
            }
        }

        function updateTOC() {
            const data = REVISION_NOTES[currentPaper][currentSection];
            const tocLinks = document.getElementById('toc-links');
            if (!tocLinks || !data.sections) return;
            
            let html = '';
            data.sections.forEach(sec => {
                html += buildTocItem(sec.id, sec.label, true);
            });
            if (data.tips || isAdmin()) {
                html += buildTocItem('note-tips-container', 'Revision Tips', false);
            }
            tocLinks.innerHTML = html;
            
            // Re-attach listeners and data-section (scroll listener already set by initNotesSidebar)
            setupTocLinksOnly();
        }

        function setupTocLinksOnly() {
            const data = REVISION_NOTES[currentPaper] && REVISION_NOTES[currentPaper][currentSection];
            const tocLinks = document.getElementById('toc-links');
            if (!tocLinks || !data || !data.sections) return;
            tocLinks.querySelectorAll('.toc-item .toc-link').forEach(function(a) {
                const id = (a.getAttribute('href') || '').replace('#', '');
                if (id) a.dataset.section = id;
                a.addEventListener('click', function(ev) {
                    ev.preventDefault();
                    handleTocClick(ev, id);
                });
            });
            const initial = (location.hash && location.hash.slice(1)) || (data.sections[0] && data.sections[0].id);
            if (initial) setActiveToc(initial);
        }

        // Highlight the TOC item matching `id`
        function setActiveToc(id) {
            if (!id) return;
            document.querySelectorAll('.notes-sidebar .toc-link').forEach(function(a) {
                a.classList.toggle('active', a.dataset.section === id);
            });
        }

        // Simple throttle
        function throttle(fn, wait) {
            let last = 0;
            return function() {
                const now = Date.now();
                if (now - last >= wait) {
                    last = now;
                    fn.apply(this, arguments);
                }
            };
        }

        function showTipsEditor() {
            const data = REVISION_NOTES[currentPaper][currentSection];
            const container = document.getElementById('note-tips-content');
            const originalTips = data.tips;

            var tipsContainer = document.getElementById('note-tips-container');
            if (tipsContainer) tipsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });

            container.innerHTML = `
                <div class="note-editor-wrap">
                    ${NOTE_FORMAT_HINT}
                    <textarea class="note-editor-textarea" id="edit-tips-area"></textarea>
                    <div class="note-editor-actions">
                        <button class="note-cancel-btn" id="cancel-tips">Cancel</button>
                        <button class="note-save-btn" onclick="saveTips()">Save Tips</button>
                    </div>
                </div>
            `;
            
            const textarea = container.querySelector('textarea');
            textarea.value = originalTips;
            
            container.querySelector('#cancel-tips').onclick = () => {
                cancelTipsEdit(originalTips);
            };
            
            textarea.focus();
        }

        function cancelTipsEdit(originalTips) {
            const container = document.getElementById('note-tips-content');
            container.innerHTML = renderNoteHtml(originalTips);
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([container]);
            }
        }

        function saveTips() {
            const textarea = document.getElementById('edit-tips-area');
            if (!textarea) return;
            const newTips = textarea.value;
            const data = REVISION_NOTES[currentPaper][currentSection];
            
            data.tips = newTips;
            const container = document.getElementById('note-tips-content');
            container.innerHTML = renderNoteHtml(newTips);
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([container]);
            }
            queueNoteUpdate(currentPaper, currentSection, 'TIPS_PROPERTY', newTips);
        }

        function queueNoteUpdate(paper, section, sectionId, content, label = null, isDelete = false) {
            const key = `${paper}|${section}|${sectionId}`;
            revisionNoteQueue = revisionNoteQueue.filter(item => item.key !== key);
            revisionNoteQueue.push({ paper, section, sectionId, content, label, delete: isDelete, key });

            showCorrectionToast(isDelete ? 'Section deletion queued' : 'Note edit queued — saving in 15s');
            if (revisionNoteTimer) clearTimeout(revisionNoteTimer);
            revisionNoteTimer = setTimeout(flushNoteUpdateQueue, REVISION_NOTE_DEBOUNCE_MS);
        }

        function flushNoteUpdateQueue() {
            if (revisionNoteTimer) { clearTimeout(revisionNoteTimer); revisionNoteTimer = null; }
            if (revisionNoteQueue.length === 0) return;

            const batch = revisionNoteQueue.map(item => ({
                paper: item.paper,
                section: item.section,
                sectionId: item.sectionId,
                content: item.content,
                label: item.label,
                delete: item.delete
            }));
            revisionNoteQueue = [];

            fetch('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ edits: batch })
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) {
                    showCorrectionToast(res.count === 1 ? 'Updated notes.js' : `${res.count} changes saved to notes.js`);
                } else {
                    showCorrectionToast('Note save failed: ' + (res.error || 'Unknown error'));
                }
            })
            .catch(err => {
                console.error('Note save error:', err);
                showCorrectionToast('Offline — changes not saved to server');
            });
        }

        window.addEventListener('beforeunload', function() {
            if (revisionNoteQueue.length > 0 && navigator.sendBeacon) {
                const blob = new Blob([JSON.stringify({ edits: revisionNoteQueue })], { type: 'application/json' });
                navigator.sendBeacon('/api/notes', blob);
            }
        });

    </script>
</body>
</html>
