<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login — ISS Statistics Question Bank</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-page">
        <a href="main.html" class="login-back-btn" aria-label="Back to question bank">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span>Back</span>
        </a>
        <div class="login-card">
            <h1 class="login-title">ISS Statistics Question Bank</h1>
            <p class="login-subtitle">Admin login to update answers</p>

            <form id="login-form" class="login-form">
                <div class="login-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="login-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <p id="login-error" class="login-error" aria-live="polite"></p>
                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="login-contact">
                <p class="login-contact-line1">Don't have access?</p>
                <p class="login-contact-line2">Contact <span id="contact-details">Loading…</span> for credentials</p>
            </div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('iss_admin') === '1') {
            window.location.href = 'main.html';
        }

        // Load contact email from API (env: CONTACT_EMAIL)
        (function() {
            var el = document.getElementById('contact-details');
            var origin = window.location.origin;
            var canUseApi = origin && origin !== 'null' && origin !== 'file://';
            var fallback = 'admin';
            if (!canUseApi) {
                el.textContent = fallback;
                return;
            }
            fetch('/api/config').then(function(r) { return r.json(); })
                .then(function(data) {
                    var detail = data.contactDetails || fallback;
                    if (detail.indexOf('@') !== -1) {
                        var a = document.createElement('a');
                        a.href = 'mailto:' + detail;
                        a.className = 'login-contact-link';
                        a.textContent = detail;
                        el.innerHTML = '';
                        el.appendChild(a);
                    } else {
                        el.textContent = detail;
                    }
                })
                .catch(function() { el.textContent = fallback; });
        })();

        var form = document.getElementById('login-form');
        var errorEl = document.getElementById('login-error');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var user = (document.getElementById('username').value || '').trim();
            var pass = (document.getElementById('password').value || '');
            errorEl.textContent = '';

            var origin = window.location.origin;
            var canUseApi = origin && origin !== 'null' && origin !== 'file://';
            if (!canUseApi) {
                errorEl.textContent = 'Login requires a server (use Vercel or server.py).';
                return;
            }

            fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            }).then(function(r) { return r.json();             }).then(function(data) {
                if (data.ok) {
                    sessionStorage.setItem('iss_admin', '1');
                    if (data.adminName) sessionStorage.setItem('iss_admin_name', data.adminName);
                    window.location.href = 'main.html';
                } else {
                    errorEl.textContent = data.error || 'Invalid username or password.';
                }
            }).catch(function() {
                errorEl.textContent = 'Login failed. Try again.';
            });
        });
    </script>
</body>
</html>
