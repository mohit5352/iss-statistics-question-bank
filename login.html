<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Login — UPSC ISS Statistics Paper I & II Question Bank</title>
    <meta name="description" content="Admin login for UPSC ISS Statistics Paper I & II Question Bank. Update answer keys for Statistics Paper I (Probability, Numerical Analysis, Computer) and Statistics Paper II (Linear Models, Statistical Inference, Official Statistics).">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://iss-statistics-question-bank.vercel.app/login">
    <!-- <link rel="stylesheet" href="https://use.typekit.net/YOUR_KIT_ID.css"> -->
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script>
        (function(){ if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme'); })();
    </script>
    <div class="login-page">
        <div class="login-header-row">
            <a href="main.html" class="login-back-btn" aria-label="Back to question bank">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span>Back</span>
        </a>
            <button type="button" class="login-theme-toggle" onclick="toggleLoginTheme()" aria-label="Toggle theme">
                <span class="theme-icon-dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg></span>
                <span class="theme-icon-light"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg></span>
            </button>
        </div>
        <div class="login-card">
            <h1 class="login-title">ISS Statistics Question Bank</h1>
            <p class="login-subtitle">Admin login — answers, notes, explanations, and Study chat (Ollama)</p>

            <form id="login-form" class="login-form">
                <div class="login-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="login-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <p id="login-error" class="login-error" aria-live="polite"></p>
                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="login-contact">
                <p class="login-contact-line1">Don't have access?</p>
                <p class="login-contact-line2">Contact <span id="contact-details">Loading…</span> for credentials</p>
            </div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('iss_admin') === '1') {
            window.location.href = 'main.html';
        }

        // Load contact email from API (env: CONTACT_EMAIL)
        (function() {
            var el = document.getElementById('contact-details');
            var origin = window.location.origin;
            var canUseApi = origin && origin !== 'null' && origin !== 'file://';
            var fallback = 'admin';
            if (!canUseApi) {
                el.textContent = fallback;
                return;
            }
            fetch('/api/config').then(function(r) { return r.json(); })
                .then(function(data) {
                    var detail = data.contactDetails || fallback;
                    if (detail.indexOf('@') !== -1) {
                        var a = document.createElement('a');
                        a.href = 'mailto:' + detail;
                        a.className = 'login-contact-link';
                        a.textContent = detail;
                        el.innerHTML = '';
                        el.appendChild(a);
                    } else {
                        el.textContent = detail;
                    }
                })
                .catch(function() { el.textContent = fallback; });
        })();

        function toggleLoginTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        var form = document.getElementById('login-form');
        var errorEl = document.getElementById('login-error');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var user = (document.getElementById('username').value || '').trim();
            var pass = (document.getElementById('password').value || '');
            errorEl.textContent = '';

            var origin = window.location.origin;
            var canUseApi = origin && origin !== 'null' && origin !== 'file://';
            if (!canUseApi) {
                errorEl.textContent = 'Login requires a server (use Vercel or server.py).';
                return;
            }

            fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            }).then(function(r) { return r.json();             }).then(function(data) {
                if (data.ok) {
                    sessionStorage.setItem('iss_admin', '1');
                    if (data.adminName) sessionStorage.setItem('iss_admin_name', data.adminName);
                    window.location.href = 'main.html';
                } else {
                    errorEl.textContent = data.error || 'Invalid username or password.';
                }
            }).catch(function() {
                errorEl.textContent = 'Login failed. Try again.';
            });
        });
    </script>
</body>
</html>
